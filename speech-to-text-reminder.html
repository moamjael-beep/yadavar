function setQuickDeadline(hours) {
    const dt = new Date(Date.now() + hours * 60 * 60 * 1000);
    const local = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    document.getElementById('itemDeadline').value = local;
    updateDeadlineDisplay(local);
}

// Update the Persian display of the deadline
function updateDeadlineDisplay(isoString) {
    const display = document.getElementById('itemDeadlineDisplay');
    if (!display) return;
    if (!isoString) {
        display.value = '';
        return;
    }
    const d = new Date(isoString);
    if (isNaN(d.getTime())) {
        display.value = '';
        return;
    }
    // Display: "1405/07/28 - 14:30 (سه‌شنبه 28 مهر)"
    const [jy, jm, jd] = toJalaliParts(d);
    const wd = jalaliWeekdays[d.getDay()];
    const timeStr = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    display.value = `${toPersianNumber(jy)}/${toPersianDigits(pad2(jm))}/${toPersianDigits(pad2(jd))} - ${toPersianDigits(timeStr)} (${wd} ${toPersianDigits(jd)} ${jalaliMonths[jm-1]})`;
}

// ============ Persian Datetime Picker ============
let pickerState = { year: null, month: null, selectedDay: null };

function openDatetimePicker() {
    // Initialize picker state from current deadline value (or today)
    const currentDeadline = document.getElementById('itemDeadline').value;
    let initialDate = new Date();
    if (currentDeadline) {
        const parsed = new Date(currentDeadline);
        if (!isNaN(parsed.getTime())) initialDate = parsed;
    }
    const [jy, jm, jd] = toJalaliParts(initialDate);
    pickerState = {
        year: jy,
        month: jm,
        selectedDay: jd,
        initialHour: initialDate.getHours(),
        initialMinute: initialDate.getMinutes()
    };
    renderPickerCalendar();
    // Populate hour/minute selects
    populateTimeSelects();
    // Set the time selects to current deadline time
    document.getElementById('pickerHour').value = String(initialDate.getHours()).padStart(2, '0');
    document.getElementById('pickerMinute').value = String(initialDate.getMinutes()).padStart(2, '0');

    document.getElementById('datetimePickerOverlay').classList.add('active');
    // Push a modal marker so back closes the picker (instead of navigating).
    navPush({ view: 'modal', type: 'datetimePicker' });
    trackModalOpen('datetimePicker');
}

function closeDatetimePicker() {
    // Visually close the picker + remove from the modal stack.
    closeModalByType('datetimePicker');
    // CRITICAL: Reset the repeat-end-date flag. If the user opened the
    // picker for the repeat end date but cancelled (didn't click "تأیید"),
    // the flag would stay true. The next time they open the datetime picker
    // (e.g., for the regular deadline), confirmDatetimePicker would
    // mistakenly store the date in the repeat end date field instead of
    // the regular deadline field.
    window._pickingRepeatEndDate = false;
    // Pop the modal marker pushed on open.
    navBack();
}

function changePickerMonth(delta) {
    let m = pickerState.month + delta;
    let y = pickerState.year;
    if (m > 12) { m = 1; y++; }
    if (m < 1) { m = 12; y--; }
    pickerState.month = m;
    pickerState.year = y;
    renderPickerCalendar();
}

function goToPickerToday() {
    const today = new Date();
    const [jy, jm, jd] = toJalaliParts(today);
    pickerState = { year: jy, month: jm, selectedDay: jd, initialHour: today.getHours(), initialMinute: today.getMinutes() };
    renderPickerCalendar();
    document.getElementById('pickerHour').value = String(today.getHours()).padStart(2, '0');
    document.getElementById('pickerMinute').value = String(today.getMinutes()).padStart(2, '0');
}

function populateTimeSelects() {
    const hourSelect = document.getElementById('pickerHour');
    const minuteSelect = document.getElementById('pickerMinute');
    if (hourSelect.children.length === 0) {
        for (let h = 0; h < 24; h++) {
            const opt = document.createElement('option');
            opt.value = String(h).padStart(2, '0');
            opt.textContent = toPersianDigits(String(h).padStart(2, '0'));
            hourSelect.appendChild(opt);
        }
    }
    if (minuteSelect.children.length === 0) {
        for (let m = 0; m < 60; m++) {
            const opt = document.createElement('option');
            opt.value = String(m).padStart(2, '0');
            opt.textContent = toPersianDigits(String(m).padStart(2, '0'));
            minuteSelect.appendChild(opt);
        }
    }
}

function renderPickerCalendar() {
    document.getElementById('pickerMonthYear').textContent =
        `${jalaliMonths[pickerState.month - 1]} ${toPersianNumber(pickerState.year)}`;

    const grid = document.getElementById('pickerGrid');
    grid.innerHTML = '';

    // Weekday header
    calWeekdayNames.forEach(w => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = w;
        grid.appendChild(el);
    });

    // Find weekday of day 1 of this Jalali month
    const firstDayG = jalaliToGregorian(pickerState.year, pickerState.month, 1);
    const jsDay = firstDayG.getUTCDay();
    const persianOffset = ((jsDay + 1) % 7);

    // Empty cells before day 1
    for (let i = 0; i < persianOffset; i++) {
        const el = document.createElement('div');
        el.className = 'cal-day other-month';
        grid.appendChild(el);
    }

    // Render days
    const daysInMonth = getDaysInJalaliMonth(pickerState.year, pickerState.month);
    const today = new Date();
    const [todayJy, todayJm, todayJd] = toJalaliParts(today);

    for (let day = 1; day <= daysInMonth; day++) {
        const el = document.createElement('button');
        el.className = 'cal-day';
        el.type = 'button';
        if (day === todayJd && pickerState.month === todayJm && pickerState.year === todayJy) {
            el.classList.add('today');
        }
        if (day === pickerState.selectedDay) {
            el.classList.add('selected');
        }
        el.textContent = toPersianDigits(day);
        el.onclick = () => {
            pickerState.selectedDay = day;
            renderPickerCalendar();
        };
        grid.appendChild(el);
    }
}

function confirmDatetimePicker() {
    if (!pickerState.selectedDay) {
        showToast('یک روز را در تقویم انتخاب کنید');
        return;
    }
    const hour = parseInt(document.getElementById('pickerHour').value, 10) || 0;
    const minute = parseInt(document.getElementById('pickerMinute').value, 10) || 0;

    // Convert selected Jalali date + time to Gregorian ISO
    const gDate = jalaliToGregorian(pickerState.year, pickerState.month, pickerState.selectedDay);
    // Build a local Date with the selected Y/M/D and H/M
    const localDate = new Date(
        gDate.getUTCFullYear(),
        gDate.getUTCMonth(),
        gDate.getUTCDate(),
        hour,
        minute,
        0, 0
    );

    // If we're picking a repeat end date, store it in the repeat field
    if (window._pickingRepeatEndDate) {
        window._pickingRepeatEndDate = false;
        const isoStr = localDate.toISOString();
        document.getElementById('repeatEndDate').value = isoStr;
        document.getElementById('repeatEndDateDisplay').value =
            toJalaliLong(localDate) + ' - ' + toPersianDigits(pad2(hour) + ':' + pad2(minute));
        closeDatetimePicker();
        return;
    }

    // Normal deadline picking
    // Format as datetime-local string (YYYY-MM-DDTHH:MM in local time)
    const offsetMs = localDate.getTimezoneOffset() * 60000;
    const localDatetimeStr = new Date(localDate.getTime() - offsetMs).toISOString().slice(0, 16);

    document.getElementById('itemDeadline').value = localDatetimeStr;
    updateDeadlineDisplay(localDatetimeStr);
    closeDatetimePicker();
}

// ============ Add flow ============
// editTaskId: when set, we're editing an existing task instead of creating a new one.
// This allows the "Edit" button to pre-fill the form with the task's current data
// and let the user modify text, deadline, or re-record audio.
let editTaskId = null;

// pendingTaskGroupId / pendingPrefilledDeadline:
// When the user taps + on the CALENDAR, we first ask them which group the
// new task should belong to (via the group-picker modal). Once they pick a
// group, we set `pendingTaskGroupId` and `pendingPrefilledDeadline`, then
// open the new-task form. saveItem() consumes these to assign the task to
// the picked group (instead of using currentGroupId, which would be wrong
// since the user might have opened the calendar from the groups list view).
let pendingTaskGroupId = null;
let pendingPrefilledDeadline = null;

// ============ Group Picker (for the calendar + button flow) ============
// Renders the picker with the current list of groups. Called from
// addTaskForSelectedDay when the user taps + on the calendar.
//
// The picker is also reused by the group-deletion flow when the user
// chooses to MOVE the deleted group's tasks to another group. In that
// case, the deleted group is excluded from the list, and a callback is
// used instead of the default "set pendingTaskGroupId + open task form"
// behavior.
let _groupPickerMode = 'newTask';  // 'newTask' (default) | 'moveTasks'
let _groupPickerExcluded = null;   // group id to exclude (for moveTasks mode)
let _groupPickerCallback = null;   // callback(groupId) for moveTasks mode
let _groupPickerTitle = 'انتخاب گروه برای یادآور جدید';

function openGroupPicker() {
    const listEl = document.getElementById('groupPickerList');
    if (!listEl) return;
    const groups = getGroups();
    const items = getDB();
    listEl.innerHTML = '';
    document.getElementById('groupPickerTitle').textContent = _groupPickerTitle;
    groups.forEach(group => {
        // In moveTasks mode, exclude the group being deleted
        if (_groupPickerMode === 'moveTasks' && group.id === _groupPickerExcluded) return;
        const count = group.id === 'all'
            ? items.length
            : items.filter(i => i.groupId === group.id).length;
        const btn = document.createElement('button');
        btn.className = 'group-picker-item';
        btn.style.background = `linear-gradient(135deg, ${group.color}, ${group.color}DD)`;
        btn.innerHTML = `<span class="gpi-name">${escapeHtml(group.name)}</span>` +
            `<span class="gpi-count">${toPersianNumber(count)}</span>`;
        btn.onclick = () => onGroupPicked(group.id);
        listEl.appendChild(btn);
    });
    document.getElementById('groupPickerOverlay').classList.add('active');
    // Push a modal marker so the mobile back button closes the picker
    // (instead of navigating underneath or exiting the app).
    navPush({ view: 'modal', type: 'groupPicker' });
    trackModalOpen('groupPicker');
}

// User tapped a group in the picker. Behavior depends on the mode:
//   - newTask (default): set pendingTaskGroupId and open the new-task form.
//   - moveTasks: invoke the callback with the picked group id.
function onGroupPicked(groupId) {
    // Close the picker visually + pop the modal marker + remove from stack.
    closeModalByType('groupPicker');
    navBack();
    const mode = _groupPickerMode;
    const cb = _groupPickerCallback;
    // Reset picker state to defaults for next time.
    _groupPickerMode = 'newTask';
    _groupPickerExcluded = null;
    _groupPickerCallback = null;
    _groupPickerTitle = 'انتخاب گروه برای یادآور جدید';
    // Wait for popstate to settle before continuing.
    setTimeout(() => {
        if (mode === 'moveTasks') {
            if (cb) cb(groupId);
        } else {
            // newTask mode (default): set pending + open task form
            pendingTaskGroupId = groupId;
            const dl = pendingPrefilledDeadline;
            pendingPrefilledDeadline = null;
            startAdding(dl);
        }
    }, 120);
}

// User tapped "انصراف" (Cancel) on the picker — just close it.
function cancelGroupPicker() {
    closeModalByType('groupPicker');
    navBack();
    pendingPrefilledDeadline = null;
    pendingTaskGroupId = null;
    _groupPickerMode = 'newTask';
    _groupPickerExcluded = null;
    _groupPickerCallback = null;
    _groupPickerTitle = 'انتخاب گروه برای یادآور جدید';
}

// ============ Group Delete Confirmation Flow (4 steps + task-fate) ============
// State: which group is being deleted, which step we're on (1-4).
let _groupDeleteTargetId = null;
let _groupDeleteStep = 0;

// Start the flow when the user taps the 🗑 button on a group's header.
function startGroupDeleteFlow(groupId) {
    const group = getGroupById(groupId);
    if (!group || group.id === 'all') return;  // safety: can't delete 'all'
    _groupDeleteTargetId = groupId;
    _groupDeleteStep = 1;
    showGroupDeleteStep();
    document.getElementById('groupDeleteConfirmOverlay').classList.add('active');
    navPush({ view: 'modal', type: 'groupDeleteConfirm' });
    trackModalOpen('groupDeleteConfirm');
}

// Render the current step's title/body/buttons.
function showGroupDeleteStep() {
    const group = getGroupById(_groupDeleteTargetId);
    if (!group) { cancelGroupDelete(); return; }
    const taskCount = getDB().filter(i => i.groupId === _groupDeleteTargetId).length;
    const titleEl = document.getElementById('groupDeleteTitle');
    const bodyEl = document.getElementById('groupDeleteBody');
    const btnsEl = document.getElementById('groupDeleteButtons');

    if (_groupDeleteStep === 1) {
        titleEl.textContent = 'حذف گروه';
        bodyEl.innerHTML = `
            <div class="gdb-step">مرحله ۱ از ۴</div>
            <div>گروه «<b>${escapeHtml(group.name)}</b>» حذف شود؟</div>
            ${taskCount > 0 ? `<div class="gdb-warning">این گروه ${toPersianNumber(taskCount)} تسک دارد.</div>` : ''}
        `;
        btnsEl.className = 'modal-buttons';
        btnsEl.innerHTML = `
            <button class="btn btn-secondary" onclick="cancelGroupDelete()">انصراف</button>
            <button class="btn btn-danger" onclick="advanceGroupDeleteStep()">تأیید</button>
        `;
    } else if (_groupDeleteStep === 2) {
        titleEl.textContent = 'تأیید دوم';
        bodyEl.innerHTML = `
            <div class="gdb-step">مرحله ۲ از ۴</div>
            <div>آیا مطمئن هستید؟</div>
            <div class="gdb-warning">این عمل قابل بازگشت نیست.</div>
        `;
        btnsEl.className = 'modal-buttons';
        btnsEl.innerHTML = `
            <button class="btn btn-secondary" onclick="cancelGroupDelete()">انصراف</button>
            <button class="btn btn-danger" onclick="advanceGroupDeleteStep()">بله، مطمئنم</button>
        `;
    } else if (_groupDeleteStep === 3) {
        titleEl.textContent = 'تأیید سوم';
        bodyEl.innerHTML = `
            <div class="gdb-step">مرحله ۳ از ۴</div>
            <div>آیا <b>واقعاً</b> مطمئن هستید؟</div>
            <div class="gdb-warning">گروه و تسک‌هایش برای همیشه حذف می‌شوند.</div>
        `;
        btnsEl.className = 'modal-buttons';
        btnsEl.innerHTML = `
            <button class="btn btn-secondary" onclick="cancelGroupDelete()">انصراف</button>
            <button class="btn btn-danger" onclick="advanceGroupDeleteStep()">بله، ادامه ده</button>
        `;
    } else if (_groupDeleteStep === 4) {
        titleEl.textContent = 'انتخاب نحوه برخورد با تسک‌ها';
        bodyEl.innerHTML = `
            <div class="gdb-step">مرحله ۴ از ۴</div>
            <div>چه کاری روی تسک‌های این گروه انجام شود؟</div>
            ${taskCount > 0
                ? `<div class="gdb-warning">${toPersianNumber(taskCount)} تسک در این گروه است.</div>`
                : `<div class="gdb-warning">این گروه خالی از تسک است.</div>`}
        `;
        btnsEl.className = 'group-delete-buttons';
        // If no tasks in the group, skip the move option (nothing to move).
        if (taskCount > 0) {
            btnsEl.innerHTML = `
                <button class="btn btn-secondary" onclick="cancelGroupDelete()">انصراف</button>
                <button class="btn btn-primary" onclick="chooseMoveTasks()">انتقال به گروه دیگر</button>
                <button class="btn btn-danger" onclick="chooseDeleteTasks()">حذف همه تسک‌ها</button>
            `;
        } else {
            btnsEl.innerHTML = `
                <button class="btn btn-secondary" onclick="cancelGroupDelete()">انصراف</button>
                <button class="btn btn-danger" onclick="chooseDeleteTasks()">حذف گروه خالی</button>
            `;
        }
    }
}

// Steps 1-3 "تأیید" button: advance to next step.
function advanceGroupDeleteStep() {
    _groupDeleteStep++;
    showGroupDeleteStep();
}

// Step 4 — user chose "delete all tasks too". Perform the deletion.
function chooseDeleteTasks() {
    const targetId = _groupDeleteTargetId;
    if (!targetId) return;
    // 1. Delete all tasks in the group
    let items = getDB();
    items = items.filter(i => i.groupId !== targetId);
    setDB(items);
    // 2. Delete the group itself
    deleteGroupRecord(targetId);
    // 3. Reset flow state
    finishGroupDelete();
    // 4. Switch underlying view to groups list (since the group we were
    //    viewing is gone). Don't call navBack here — navBack would fire
    //    popstate with the underlying state (which is the now-stale
    //    tasks-view-of-deleted-group), and the popstate handler would
    //    OVERWRITE our currentView='groups' assignment. Instead, use
    //    navReplace to swap the modal state with {view:'groups'} so the
    //    current history entry matches the new view.
    currentView = 'groups';
    currentGroupId = null;
    expandedId = null;
    closeModalByType('groupDeleteConfirm');
    navReplace({ view: 'groups' });
    showToast('گروه و همه تسک‌هایش حذف شدند');
    fullRender();
}

// Step 4 — user chose "move tasks to another group". Open the group picker
// (reusing the existing overlay) with the deleted group excluded.
function chooseMoveTasks() {
    const targetId = _groupDeleteTargetId;
    if (!targetId) return;
    // Close the confirmation modal first (visually + pop state)
    closeModalByType('groupDeleteConfirm');
    navBack();
    // After popstate settles, open the group picker in "moveTasks" mode.
    setTimeout(() => {
        _groupPickerMode = 'moveTasks';
        _groupPickerExcluded = targetId;
        _groupPickerTitle = 'انتخاب گروه مقصد برای انتقال تسک‌ها';
        _groupPickerCallback = (destinationId) => confirmMoveTasksAndDelete(targetId, destinationId);
        openGroupPicker();
    }, 120);
}

// User picked a destination group in the move-tasks picker.
function confirmMoveTasksAndDelete(sourceId, destinationId) {
    if (!sourceId || !destinationId) return;
    if (sourceId === destinationId) {
        showToast('گروه مقصد همان گروه حذفی است');
        return;
    }
    // 1. Move all tasks from source group to destination group
    const items = getDB();
    items.forEach(item => {
        if (item.groupId === sourceId) {
            item.groupId = destinationId;
        }
    });
    setDB(items);
    // 2. Delete the source group record
    deleteGroupRecord(sourceId);
    // 3. Switch underlying view to the destination group's tasks view so
    //    the user can see their moved tasks immediately. Use navReplace
    //    (not navBack) to swap the current top state in place — avoids
    //    a popstate race that would overwrite our currentView assignment.
    currentView = 'tasks';
    currentGroupId = destinationId;
    expandedId = null;
    navReplace({ view: 'tasks', groupId: destinationId });
    showToast('تسک‌ها منتقل شدند و گروه حذف شد ✓');
    fullRender();
}

// User canceled at any step.
function cancelGroupDelete() {
    closeModalByType('groupDeleteConfirm');
    navBack();
    _groupDeleteTargetId = null;
    _groupDeleteStep = 0;
}

// Internal: cleanup after a successful deletion (resets state).
function finishGroupDelete() {
    _groupDeleteTargetId = null;
    _groupDeleteStep = 0;
}

// Internal: delete a group record (without touching tasks — the caller
// handles task relocation separately).
function deleteGroupRecord(id) {
    if (id === 'all') return false;  // safety: can't delete the default group
    let groups = getGroups();
    groups = groups.filter(g => g.id !== id);
    setGroups(groups);
    return true;
}

function startAdding(prefilledDeadline, prefilledText) {
    // The + button is disabled on the groups list view — a new task needs
    // to know which group to be assigned to. If the user somehow invokes
    // startAdding while on the groups view (e.g., via a keyboard shortcut),
    // refuse and guide them.
    // EXCEPTION: when `pendingTaskGroupId` is set, the user came in via the
    // calendar + flow (where they explicitly picked a group via the picker),
    // so we skip the guard — the group is already known.
    if (currentView === 'groups' && !pendingTaskGroupId) {
        showToast('ابتدا وارد یک گروه شوید، سپس + را بزنید');
        return;
    }
    if (isRecording) {
        stopRecording();
        return;
    }
    document.getElementById('modalOverlay').classList.add('active');
    // Push a modal marker so back closes the form (instead of navigating).
    navPush({ view: 'modal', type: 'taskForm' });
    trackModalOpen('taskForm');
    // Pre-fill text and deadline (used when editing an existing task)
    document.getElementById('itemText').value = prefilledText || '';
    document.getElementById('itemDeadline').value = prefilledDeadline || '';
    // RESET ALL repeat fields to default — prevents stale values from leaking
    var rt = document.getElementById('repeatType');
    var rv = document.getElementById('repeatValue');
    var re = document.getElementById('repeatEndDate');
    var rd = document.getElementById('repeatEndDateDisplay');
    if (rt) rt.value = 'none';
    if (rv) { rv.value = '1'; rv.style.display = 'none'; }
    if (re) re.value = '';
    if (rd) rd.value = '';
    var ru = document.getElementById('repeatUnit');
    if (ru) ru.style.display = 'none';
    var rr = document.getElementById('repeatEndRow');
    if (rr) rr.style.display = 'none';
    // Update the Persian display of the deadline (if any)
    if (prefilledDeadline) {
        updateDeadlineDisplay(prefilledDeadline);
    }
    // Update the modal title and save button text to reflect whether we're editing or creating
    const isEditing = !!editTaskId;
    document.getElementById('modalTitle').textContent = isEditing ? 'ویرایش یادآور' : 'یادآور جدید';
    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn) saveBtn.textContent = isEditing ? 'ثبت ویرایش' : 'ذخیره';

    // When editing: go directly to form section with pre-filled text (NO auto-recording)
    // The user can manually click "ضبط دوباره" if they want to re-record
    if (isEditing) {
        document.getElementById('recordingSection').style.display = 'none';
        document.getElementById('formSection').style.display = 'block';
        if (!prefilledDeadline) setQuickDeadline(1);
        // Focus the textarea so user can immediately edit the text
        setTimeout(() => {
            const textArea = document.getElementById('itemText');
            textArea.focus();
            // Place cursor at end of text
            textArea.setSelectionRange(textArea.value.length, textArea.value.length);
        }, 100);
        return;
    }

    // Normal flow (new task): check if speech is supported & viable
    if (!isSpeechSupported()) {
        // Direct manual mode
        document.getElementById('recordingSection').style.display = 'none';
        document.getElementById('formSection').style.display = 'block';
        if (!prefilledDeadline) setQuickDeadline(1);
        showToast('مرورگر از ضبط پشتیبانی نمی‌کند. متن را تایپ کنید.');
        setTimeout(() => document.getElementById('itemText').focus(), 100);
        return;
    }
    // If the header is flashing blue-yellow (offline / no real internet),
    // skip recording and go directly to manual typing — don't attempt
    // voice recognition at all (it would fail or hang without real
    // connectivity).
    if (!isReachable) {
        document.getElementById('recordingSection').style.display = 'none';
        document.getElementById('formSection').style.display = 'block';
        if (!prefilledDeadline) setQuickDeadline(1);
        showToast('اینترنت در دسترس نیست. متن را تایپ کنید.');
        setTimeout(() => document.getElementById('itemText').focus(), 100);
        return;
    }
    // For file:// protocol, warn and offer both modes
    if (location.protocol === 'file:') {
        showManualMode(prefilledDeadline
            ? 'سررسید روی روز انتخاب‌شده تنظیم شد. ضبط صوت روی فایل محلی ممکن است کار نکند. می‌توانید متن را تایپ کنید یا ضبط را امتحان کنید.'
            : 'ضبط صوت روی فایل محلی ممکن است کار نکند. می‌توانید متن را تایپ کنید یا ضبط را امتحان کنید.');
        return;
    }
    // small delay for modal to appear
    setTimeout(startRecording, 250);
}

// Edit an existing task: opens the new-task modal pre-filled with the task's data.
// User can modify text, deadline, or re-record audio. On save, the existing task is updated.
function editTask(id) {
    const items = getDB();
    const item = items.find(i => i.id === id);
    if (!item) {
        showToast('تسک یافت نشد');
        return;
    }

    // If this is a CHILD task (has parentId), ask the user: edit the parent
    // (which cascades to all children) or just this child?
    let editId = id;
    if (item.parentId) {
        const parent = items.find(i => i.id === item.parentId);
        if (parent) {
            const choice = confirm(
                'این یک تسک تکرارشونده است.\n' +
                'برای ویرایش تسک اصلی (و همه تکرارها) = بله\n' +
                'برای ویرایش فقط همین نسخه = خیر'
            );
            if (choice) {
                editId = item.parentId;
            }
        }
    }

    const editItem = items.find(i => i.id === editId) || item;
    // Set the edit flag so saveItem() knows to update instead of create
    editTaskId = editId;
    // If the task was expanded, collapse it visually
    if (expandedId === id) {
        expandedId = null;
        navReplace({ view: 'tasks', groupId: currentGroupId });
    } else {
        render();
    }
    // Convert the existing deadline to datetime-local format
    let prefilledDeadline = '';
    if (editItem.deadline) {
        const d = new Date(editItem.deadline);
        if (!isNaN(d.getTime())) {
            const offsetMs = d.getTimezoneOffset() * 60000;
            prefilledDeadline = new Date(d.getTime() - offsetMs).toISOString().slice(0, 16);
        }
    }
    // Open the new-task modal with the existing text and deadline pre-filled
    startAdding(prefilledDeadline, editItem.text);
    // AFTER startAdding (which resets repeat fields), load the parent's
    // repeat config into the form so the user can see & modify it
    if (editItem.repeat && editItem.repeat.type !== 'none') {
        document.getElementById('repeatType').value = editItem.repeat.type;
        document.getElementById('repeatValue').value = editItem.repeat.value;
        document.getElementById('repeatEndDate').value = editItem.repeat.endDate;
        // Show the display
        const endDate = new Date(editItem.repeat.endDate);
        if (!isNaN(endDate.getTime())) {
            document.getElementById('repeatEndDateDisplay').value = toJalaliLong(endDate);
        }
        onRepeatTypeChange();
    }
}

// Add a new task for the currently selected calendar day.
// Closes the calendar modal, opens the new-task modal with the deadline pre-filled,
// and starts voice recording (when supported on a secure context).
function addTaskForSelectedDay() {
    if (!calState || !calState.selectedDay) {
        showToast('ابتدا یک روز را در تقویم انتخاب کنید');
        return;
    }

    // Get the Gregorian date corresponding to the selected Jalali day (UTC midnight)
    const gDate = jalaliToGregorian(calState.year, calState.month, calState.selectedDay);
    // Combine with current local time so the deadline time = "today's current time" on the selected day
    const now = new Date();
    const localDate = new Date(
        gDate.getUTCFullYear(),
        gDate.getUTCMonth(),
        gDate.getUTCDate(),
        now.getHours(),
        now.getMinutes(),
        0, 0
    );

    // Format as datetime-local string (YYYY-MM-DDTHH:MM in local time)
    const offsetMs = localDate.getTimezoneOffset() * 60000;
    const localDatetimeStr = new Date(localDate.getTime() - offsetMs).toISOString().slice(0, 16);

    // Show feedback to user
    const dayLabel = `${toPersianDigits(calState.selectedDay)} ${jalaliMonths[calState.month - 1]} ${toPersianNumber(calState.year)}`;
    showToast(`سررسید روی ${dayLabel} تنظیم شد`);

    // Stash the pre-filled deadline so the picker flow can pass it on to
    // startAdding after the user picks a group.
    pendingPrefilledDeadline = localDatetimeStr;

    // Close calendar modal first (this pops the calendar state from history
    // and removes 'calendar' from the modal stack).
    closeCalendar();

    // Then open the GROUP PICKER modal (so the user can pick which group
    // the new task should belong to). After they pick, pickGroupForNewTask
    // will open the new-task form with the deadline pre-filled.
    setTimeout(() => openGroupPicker(), 300);
}

// ============ Repeat Logic ============
// Handles the repeat UI in the task form and generates repeated task copies.

// Generate repeated task instances — each child has a parentId linking it
// to the parent. This enables cascade delete and cascade update.
function generateRepeatedTasks(baseItem, repeatType, repeatValue, repeatEndDate) {
    if (!repeatType || repeatType === 'none' || !repeatValue || !repeatEndDate) {
        return [];
    }
    const result = [];
    const interval = parseInt(repeatValue, 10);
    if (isNaN(interval) || interval < 1) return [];

    // CRITICAL: Validate the end date and base deadline BEFORE entering the
    // loop. If either is invalid (NaN), the loop condition
    // `currentDeadline.getTime() > endMs` would always be `false` (any
    // comparison with NaN returns false) → INFINITE LOOP → OOM crash.
    // Also: validate the base deadline is valid (defensive — the caller
    // should validate, but we shouldn't trust them).
    const endMs = new Date(repeatEndDate).getTime();
    if (isNaN(endMs)) {
        console.error('[generateRepeatedTasks] Invalid repeatEndDate:', repeatEndDate);
        return [];
    }
    if (!baseItem || !baseItem.deadline) {
        console.error('[generateRepeatedTasks] Missing baseItem.deadline');
        return [];
    }
    const baseDeadlineMs = new Date(baseItem.deadline).getTime();
    if (isNaN(baseDeadlineMs)) {
        console.error('[generateRepeatedTasks] Invalid baseItem.deadline:', baseItem.deadline);
        return [];
    }
    let currentDeadline = new Date(baseItem.deadline);

    // SAFETY: hard cap on the number of children to prevent runaway loops
    // in case of any unforeseen bug. 1000 is more than enough for any
    // practical repeat task scenario.
    const MAX_CHILDREN = 1000;
    let iterations = 0;

    while (true) {
        if (iterations++ > MAX_CHILDREN) {
            console.error('[generateRepeatedTasks] Exceeded MAX_CHILDREN=' + MAX_CHILDREN + ' — aborting to prevent OOM');
            break;
        }
        // Advance to next occurrence
        switch (repeatType) {
            case 'hours':
                currentDeadline = new Date(currentDeadline.getTime() + interval * 60 * 60 * 1000);
                break;
            case 'days':
                currentDeadline = new Date(currentDeadline.getTime() + interval * 24 * 60 * 60 * 1000);
                break;
            case 'weeks':
                currentDeadline = new Date(currentDeadline.getTime() + interval * 7 * 24 * 60 * 60 * 1000);
                break;
            case 'months':
                let m = currentDeadline.getMonth() + interval;
                let y = currentDeadline.getFullYear() + Math.floor(m / 12);
                m = m % 12;
                const day = Math.min(currentDeadline.getDate(), 28);
                currentDeadline = new Date(y, m, day, currentDeadline.getHours(), currentDeadline.getMinutes(), 0, 0);
                break;
            default:
                return result;
        }

        if (currentDeadline.getTime() > endMs) break;

        // Create a CHILD copy — linked to parent via parentId
        const copy = {
            id: 'r_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9) + '_' + result.length,
            text: baseItem.text,
            createdAt: baseItem.createdAt,
            deadline: currentDeadline.toISOString(),
            done: false,
            groupId: baseItem.groupId,
            parentId: baseItem.id,  // ← parent-child link
        };
        result.push(copy);
    }
    return result;
}

function saveItem() {
    const text = document.getElementById('itemText').value.trim();
    const deadlineStr = document.getElementById('itemDeadline').value;
    if (!text) {
        showToast('متن یادآور خالی است');
        return;
    }
    if (!deadlineStr) {
        showToast('زمان سررسید را وارد کنید');
        return;
    }
    const deadline = new Date(deadlineStr);
    if (isNaN(deadline.getTime())) {
        showToast('زمان سررسید نامعتبر است');
        return;
    }
    const now = new Date();

    const items = getDB();
    
    // If editTaskId is set, we're editing an existing task - update it
    if (editTaskId) {
        const idx = items.findIndex(i => i.id === editTaskId);
        if (idx === -1) {
            showToast('تسک یافت نشد — جدید ساخته می‌شود');
            editTaskId = null;
            // Fall through to create new
        } else {
            const oldText = items[idx].text;
            const oldDeadline = items[idx].deadline;
            const newText = text;
            const newDeadline = deadline.toISOString();
            // Update the parent's text and deadline
            items[idx].text = newText;
            items[idx].deadline = newDeadline;

            // CASCADE: if this is a parent task with children (has repeat config),
            // update all children's text AND recalculate their deadlines based
            // on the new parent deadline + the repeat interval.
            // NOTE: use editTaskId (not editId) — editId is local to editTask.
            var parentTaskId = editTaskId;  // ← the ID being edited
            const repeatConfig = items[idx].repeat;
            if (repeatConfig && repeatConfig.type !== 'none') {
                // Check if the user changed the repeat settings in the form
                var formRepeatType = document.getElementById('repeatType') ?
                    document.getElementById('repeatType').value : 'none';
                var formRepeatValue = document.getElementById('repeatValue') ?
                    document.getElementById('repeatValue').value : '';
                var formRepeatEndDate = document.getElementById('repeatEndDate') ?
                    document.getElementById('repeatEndDate').value : '';

                // Update repeat config from the form
                if (formRepeatType !== 'none' && formRepeatValue && formRepeatEndDate) {
                    items[idx].repeat = {
                        type: formRepeatType,
                        value: parseInt(formRepeatValue, 10),
                        endDate: formRepeatEndDate,
                    };
                }

                // Regenerate ALL children: remove old ones, generate new ones
                // with updated text + recalculated deadlines
                if (formRepeatType !== 'none' && formRepeatValue && formRepeatEndDate) {
                    // Remove old children
                    var filteredItems = items.filter(function(i) { return i.parentId !== parentTaskId; });
                    // Generate new children
                    var newChildren = generateRepeatedTasks(items[idx], formRepeatType, formRepeatValue, formRepeatEndDate);
                    for (var ci = 0; ci < newChildren.length; ci++) {
                        filteredItems.push(newChildren[ci]);
                    }
                    // Replace items array (mutate in-place, since 'items' is const)
                    items.length = 0;
                    for (var fi = 0; fi < filteredItems.length; fi++) {
                        items.push(filteredItems[fi]);
                    }
                } else {
                    // Just update text on existing children (repeat config unchanged)
                    var children = items.filter(function(i) { return i.parentId === parentTaskId; });
                    var currentDeadline = new Date(newDeadline);
                    var cfg = items[idx].repeat;
                    for (var chi = 0; chi < children.length; chi++) {
                        children[chi].text = newText;
                        switch (cfg.type) {
                            case 'hours': currentDeadline = new Date(currentDeadline.getTime() + cfg.value * 60*60*1000); break;
                            case 'days': currentDeadline = new Date(currentDeadline.getTime() + cfg.value * 24*60*60*1000); break;
                            case 'weeks': currentDeadline = new Date(currentDeadline.getTime() + cfg.value * 7*24*60*60*1000); break;
                            case 'months':
                                var mm2 = currentDeadline.getMonth() + cfg.value;
                                var yy2 = currentDeadline.getFullYear() + Math.floor(mm2 / 12);
                                mm2 = mm2 % 12;
                                var dd2 = Math.min(currentDeadline.getDate(), 28);
                                currentDeadline = new Date(yy2, mm2, dd2, currentDeadline.getHours(), currentDeadline.getMinutes(), 0, 0);
                                break;
                        }
                        children[chi].deadline = currentDeadline.toISOString();
                    }
                }
            }

            setDB(items);
            // Recalculate positions for the group (the deadline may have
            // changed, so the task might need to move to a new position).
            recalcGroupPositions(items[idx].groupId || 'all');
            document.getElementById('modalOverlay').classList.remove('active');
            // Remove from the modal stack and pop the modal marker.
            trackModalClose('taskForm');
            navBack();
            document.getElementById('itemText').value = '';
            document.getElementById('itemDeadline').value = '';
            editTaskId = null;  // Clear the edit flag
            fullRender();
            showToast('تسک ویرایش شد ✓');
            return;
        }
    }

    // Create a new task — assign to the picked group (pendingTaskGroupId, set
    // by the calendar + flow), else the currently-viewed group (currentGroupId),
    // else the default 'all'.
    // NO `position` field is set on new tasks — this lets the sort logic fall
    // back to deadline-based ordering (position defaults to 999999 for
    // unpositioned tasks, which are then sorted by deadline). The user can
    // manually drag the task later to override its position.
    const newTaskGroupId = pendingTaskGroupId || currentGroupId || 'all';
    const newItem = {
        id: 'r_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        text: text,
        createdAt: now.toISOString(),
        deadline: deadline.toISOString(),
        done: false,
        groupId: newTaskGroupId,
        // position intentionally NOT set — sort by deadline as fallback
    };
    items.push(newItem);

    // Check repeat settings and generate children if configured
    var repType = document.getElementById('repeatType');
    var repVal = document.getElementById('repeatValue');
    var repEnd = document.getElementById('repeatEndDate');
    var rType = repType ? repType.value : 'none';
    var rVal = repVal ? repVal.value : '';
    var rEnd = repEnd ? repEnd.value : '';
    console.log('[saveItem] repeat check: type=' + rType + ' value=' + rVal + ' endDate=' + rEnd);
    // CRITICAL: Wrap the repeat task generation in a try-catch so that even
    // if anything fails (bad date format, invalid number, etc.), the parent
    // task is still saved. Previously, an exception here would propagate up
    // and prevent setDB() from being called — so NEITHER parent NOR
    // children would be created (the bug the user was reporting).
    var repeatError = null;
    try {
        if (rType && rType !== 'none' && rVal && rEnd) {
            var repeats = generateRepeatedTasks(newItem, rType, rVal, rEnd);
            console.log('[saveItem] generated ' + repeats.length + ' repeat children');
            if (repeats.length > 0) {
                newItem.repeat = { type: rType, value: parseInt(rVal, 10), endDate: rEnd };
                // Use a plain for-loop instead of .apply() — some older
                // Android WebViews have a bug where Function.prototype.apply
                // with a large array throws "Maximum call stack exceeded"
                // even when the array is small.
                for (var ri = 0; ri < repeats.length; ri++) {
                    items.push(repeats[ri]);
                }
                showToast(repeats.length + 1 + ' تسک تکرارشونده ساخته شد');
            } else {
                // No children generated (e.g., deadline > end date) — but
                // still mark the parent as a repeating task so the user can
                // see the repeat config in the future.
                newItem.repeat = { type: rType, value: parseInt(rVal, 10), endDate: rEnd };
                console.log('[saveItem] repeat configured but no children generated (deadline > endDate)');
            }
        }
    } catch(e) {
        repeatError = e;
        console.error('[saveItem] repeat generation FAILED:', e.message, e.stack);
        // Don't show toast here — the parent will still be saved, and the
        // "یادآور ذخیره شد ✓" toast at the end will be shown.
        // The repeat config is lost, but at least the parent task is saved.
    }

    setDB(items);
    // Clear the pending-group context (it has been consumed by the new task).
    pendingTaskGroupId = null;
    pendingPrefilledDeadline = null;
    // Recalculate positions for all tasks in the group based on deadline
    // order. This ensures the new task goes to its correct chronological
    // position (not stuck at the end or before positioned tasks).
    try {
        recalcGroupPositions(newTaskGroupId);
    } catch(e) {
        console.error('[saveItem] recalcGroupPositions failed:', e.message);
        // Don't block — the task is already saved.
    }

    document.getElementById('modalOverlay').classList.remove('active');
    // Remove from the modal stack and pop the modal marker.
    trackModalClose('taskForm');
    navBack();
    document.getElementById('itemText').value = '';
    document.getElementById('itemDeadline').value = '';
    // Reset repeat fields
    if (document.getElementById('repeatType')) document.getElementById('repeatType').value = 'none';
    if (document.getElementById('repeatValue')) document.getElementById('repeatValue').value = '1';
    if (document.getElementById('repeatEndDate')) document.getElementById('repeatEndDate').value = '';
    if (document.getElementById('repeatEndDateDisplay')) document.getElementById('repeatEndDateDisplay').value = '';
    onRepeatTypeChange();

    fullRender();
    showToast('یادآور ذخیره شد ✓');
}

// ============ Urgency / Color ============
function getUrgencyLevel(deadline, done) {
    if (done) return 'done';
    const remaining = new Date(deadline).getTime() - Date.now();
    if (remaining < 0) return 'overdue';
    const hours = remaining / (1000 * 60 * 60);
    if (hours < 4) return 'urgent';
    if (hours < 12) return 'warning';
    if (hours < 24) return 'caution';
    return 'normal';
}

function formatRemaining(deadline, done) {
    if (done) return 'انجام شد';
    const remaining = new Date(deadline).getTime() - Date.now();
    if (remaining < 0) {
        const od = -remaining;
        const days = Math.floor(od / 86400000);
        const hours = Math.floor((od % 86400000) / 3600000);
        const mins = Math.floor((od % 3600000) / 60000);
        if (days > 0) return `گذشت ${toPersianNumber(days)} روز`;
        if (hours > 0) return `گذشت ${toPersianNumber(hours)} ساعت`;
        return `گذشت ${toPersianNumber(mins)} دقیقه`;
    }
    const days = Math.floor(remaining / 86400000);
    const hours = Math.floor((remaining % 86400000) / 3600000);
    const mins = Math.floor((remaining % 3600000) / 60000);
    if (days > 0) return `${toPersianNumber(days)} روز مانده`;
    if (hours > 0) return `${toPersianNumber(hours)} ساعت مانده`;
    if (mins > 0) return `${toPersianNumber(mins)} دقیقه مانده`;
    return '< ۱ دقیقه';
}

// ============ Migration & Drag-Drop Reordering ============

// Migrate existing tasks: assign position field if missing
function migrateTaskPositions() {
    const items = getDB();
    let changed = false;
    // Sort by deadline first to give a sensible initial order
    const sorted = [...items].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return new Date(a.deadline).getTime() - new Date(b.deadline).getTime();
    });
    let notDonePos = 0;
    let donePos = 0;
    sorted.forEach(item => {
        if (typeof item.position !== 'number') {
            item.position = item.done ? donePos++ : notDonePos++;
            changed = true;
        } else {
            if (item.done) donePos++; else notDonePos++;
        }
    });
    if (changed) {
        setDB(items);
        console.log('[Page] Migrated task positions');
    }
}

// Initialize SortableJS on the task container
// Allows drag-drop reordering. On end, saves new positions to localStorage.
let sortableInstance = null;
let groupsSortableInstance = null;  // separate instance for the groups list

function initSortable() {
    if (typeof Sortable === 'undefined') {
        console.warn('SortableJS not loaded (offline?), drag-drop disabled');
        return;
    }
    const container = document.getElementById('container');
    if (!container) return;
    // Destroy existing instances if any (for re-init after render)
    if (sortableInstance) {
        try { sortableInstance.destroy(); } catch(e) {}
        sortableInstance = null;
    }
    if (groupsSortableInstance) {
        try { groupsSortableInstance.destroy(); } catch(e) {}
        groupsSortableInstance = null;
    }
    // On the groups list view, initialize the GROUPS drag-drop Sortable
    // (lets the user reorder custom groups, with "همه کارها" pinned to top).
    if (currentView === 'groups') {
        initGroupsSortable(container);
        return;
    }
    // In the "همه کارها" group, no Sortable (read-only ordering by deadline).
    if (currentGroupId === 'all') {
        return;
    }
    sortableInstance = Sortable.create(container, {
        animation: 300,           // smoother slide animation (ms) - soap-like
        easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',  // bouncy spring easing
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        // Don't allow dragging the empty-state message or expanded details
        filter: '.empty, .item-details, .item-actions, .action-btn, .deadline-box',
        preventOnFilter: false,   // allow clicks on filtered elements
        // Long-press on touch to start drag (so tap-to-expand still works)
        delay: 400,               // 400ms long-press (slightly faster)
        delayOnTouchOnly: true,   // only on touch devices
        touchStartThreshold: 8,
        // Allow scroll while dragging (mobile-friendly)
        scroll: true,
        scrollSensitivity: 80,
        scrollSpeed: 15,
        bubbleScroll: true,
        // Don't swap - insert at position (more natural feel)
        swap: false,
        // Allow dragging into empty space
        forceFallback: false,     // use native HTML5 DnD on desktop, touch on mobile
        fallbackOnBody: false,
        onChoose: function(evt) {
            // Haptic feedback when drag starts
            if (navigator.vibrate) navigator.vibrate(15);
        },
        onStart: function(evt) {
            // Stronger haptic when actually moving
            if (navigator.vibrate) navigator.vibrate(30);
        },
        onEnd: function(evt) {
            if (evt.oldIndex === evt.newIndex) return;
            // Save new order. Pass the dragged task's id so it can be marked
            // as `pinned` — pinned tasks keep their position when
            // recalcGroupPositions runs (after adding/editing tasks).
            saveNewOrder(evt.item ? evt.item.dataset.id : null);
        }
    });
}

// Initialize the GROUPS-list drag-drop Sortable. Lets the user reorder
// custom groups; the "همه کارها" item is pinned to the top (cannot be
// dragged, and other items cannot be moved above it).
function initGroupsSortable(container) {
    if (typeof Sortable === 'undefined') {
        console.warn('[Groups Sortable] SortableJS not loaded — drag-drop for groups disabled. Check CDN connection.');
        return;
    }
    try {
        groupsSortableInstance = Sortable.create(container, {
            animation: 250,
            easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            dragClass: 'sortable-drag',
            // Don't drag the fixed "همه کارها" item or the "add new group" button.
            filter: '.group-item-fixed, .add-group',
            preventOnFilter: false,  // allow clicks on filtered elements
            // Long-press on touch to start drag (so tap-to-open still works).
            // 300ms is a good balance — feels responsive but doesn't conflict with tap.
            delay: 300,
            delayOnTouchOnly: true,
            touchStartThreshold: 8,
            scroll: true,
            scrollSensitivity: 80,
            scrollSpeed: 15,
            bubbleScroll: true,
            swap: false,
            forceFallback: false,
            fallbackOnBody: false,
            onChoose: function(evt) {
                if (navigator.vibrate) navigator.vibrate(15);
            },
            onStart: function(evt) {
                if (navigator.vibrate) navigator.vibrate(30);
                console.log('[Groups Sortable] drag started for group:', evt.item.dataset.groupId);
            },
            onMove: function(evt) {
                // Prevent dragging items ABOVE the fixed "همه کارها" item.
                if (evt.related && evt.related.classList.contains('group-item-fixed')
                    && !evt.willInsertAfter) {
                    return false;
                }
                return true;
            },
            onEnd: function(evt) {
                if (evt.oldIndex === evt.newIndex) return;
                saveGroupsOrder();
            }
        });
        console.log('[Groups Sortable] initialized successfully on container');
    } catch (e) {
        console.error('[Groups Sortable] failed to initialize:', e.message);
    }
}

// Save the new group order from DOM to localStorage.
// Safety net: if "همه کارها" somehow ended up not at index 0 (e.g., due to
// a race or a drag the onMove handler missed), move it back to index 0.
function saveGroupsOrder() {
    const container = document.getElementById('container');
    if (!container) return;
    const domIds = [...container.querySelectorAll('.group-item[data-group-id]')]
        .map(el => el.dataset.groupId)
        .filter(id => id);
    const groups = getGroups();
    const reordered = [];
    domIds.forEach(id => {
        const g = groups.find(x => x.id === id);
        if (g) reordered.push(g);
    });
    // Safety: ensure "all" is at index 0
    const allIdx = reordered.findIndex(g => g.id === 'all');
    if (allIdx > 0) {
        const allG = reordered.splice(allIdx, 1)[0];
        reordered.unshift(allG);
    } else if (allIdx === -1) {
        // "all" not in DOM (shouldn't happen) — prepend it
        reordered.unshift({ id: 'all', name: 'همه کارها', color: '#4CAF50', isDefault: true });
    }
    // Safety: append any groups that weren't in the DOM (shouldn't happen)
    groups.forEach(g => {
        if (!reordered.find(r => r.id === g.id)) reordered.push(g);
    });
    setGroups(reordered);
    showToast('ترتیب گروه‌ها ذخیره شد ✓');
    if (navigator.vibrate) navigator.vibrate(30);
}

// Save the new order from DOM to localStorage.
// `draggedId` (optional): the id of the task that was actually dragged by
// the user. That task is marked as `pinned: true` — when recalcGroupPositions
// runs later (after adding/editing a task), pinned tasks keep their position
// and are NOT moved back to their deadline-based position.
function saveNewOrder(draggedId) {
    const container = document.getElementById('container');
    if (!container) return;
    const domOrder = [...container.querySelectorAll('.item')]
        .map(el => el.dataset.id)
        .filter(id => id);
    const items = getDB();
    // Separate done and not-done tasks based on their current done status
    // (we preserve the visual grouping: not-done first, done at bottom)
    const notDoneIds = domOrder.filter(id => {
        const it = items.find(i => i.id === id);
        return it && !it.done;
    });
    const doneIds = domOrder.filter(id => {
        const it = items.find(i => i.id === id);
        return it && it.done;
    });
    // Assign positions
    notDoneIds.forEach((id, idx) => {
        const it = items.find(i => i.id === id);
        if (it) it.position = idx;
    });
    doneIds.forEach((id, idx) => {
        const it = items.find(i => i.id === id);
        if (it) it.position = idx;
    });
    // Mark ONLY the dragged task as pinned. Other tasks that shifted to
    // accommodate the drag are NOT pinned — they can be re-sorted by
    // deadline when a new task is added.
    if (draggedId) {
        const dragged = items.find(i => i.id === draggedId);
        if (dragged) {
            dragged.pinned = true;
        }
    }
    setDB(items);
    // Full re-render with SortableJS re-init to ensure drag-drop continues working
    fullRender();
    if (navigator.vibrate) navigator.vibrate(30);
}

// Recalculate positions for all tasks in a group based on deadline order.
// Called after creating/editing a task to ensure the new/edited task goes
// to its correct chronological position.
//
// IMPORTANT: tasks marked as `pinned: true` (manually dragged by the user)
// KEEP their existing position — they are NOT moved back to their
// deadline-based position. Only non-pinned tasks are re-sorted by deadline
// and assigned positions that fill the "gaps" around pinned tasks.
//
// Example: if pinned tasks have positions [0, 5] and non-pinned tasks (sorted
// by deadline) are [A, B, C, D], they get positions [1, 2, 3, 4] (filling
// the gap between 0 and 5) and [6, 7, ...] (after 5). The sort then shows:
// pinned(0), A(1), B(2), C(3), D(4), pinned(5) — pinned tasks stay in
// place, non-pinned tasks are sorted by deadline in the gaps.
function recalcGroupPositions(groupId) {
    const items = getDB();
    const groupItems = items.filter(i => (i.groupId || 'all') === groupId);

    // Separate pinned from non-pinned, and by done status
    const pinnedNotDone = groupItems.filter(i => i.pinned === true && !i.done);
    const pinnedDone = groupItems.filter(i => i.pinned === true && i.done);
    const nonPinnedNotDone = groupItems
        .filter(i => i.pinned !== true && !i.done)
        .sort((a, b) => new Date(a.deadline).getTime() - new Date(b.deadline).getTime());
    const nonPinnedDone = groupItems
        .filter(i => i.pinned !== true && i.done)
        .sort((a, b) => new Date(a.deadline).getTime() - new Date(b.deadline).getTime());

    // Collect pinned positions (to skip them when assigning non-pinned positions)
    const pinnedNotDonePositions = new Set(
        pinnedNotDone.map(i => typeof i.position === 'number' ? i.position : -1)
    );
    const pinnedDonePositions = new Set(
        pinnedDone.map(i => typeof i.position === 'number' ? i.position : -1)
    );

    // Assign positions to non-pinned not-done tasks, filling gaps around pinned tasks.
    // Start from 0, skip any position used by a pinned task.
    let pos = 0;
    for (const item of nonPinnedNotDone) {
        while (pinnedNotDonePositions.has(pos)) pos++;
        const orig = items.find(i => i.id === item.id);
        if (orig) orig.position = pos;
        pos++;
    }

    // Assign positions to non-pinned done tasks (separate namespace — done
    // tasks are always after not-done tasks in the sort)
    pos = 0;
    for (const item of nonPinnedDone) {
        while (pinnedDonePositions.has(pos)) pos++;
        const orig = items.find(i => i.id === item.id);
        if (orig) orig.position = pos;
        pos++;
    }

    setDB(items);
    console.log(`[recalcGroupPositions] group=${groupId}, pinnedNotDone=${pinnedNotDone.length}, nonPinnedNotDone=${nonPinnedNotDone.length}, pinnedDone=${pinnedDone.length}, nonPinnedDone=${nonPinnedDone.length}`);
}

// Reset a single task's position so it goes back to its natural deadline-based position.
// Removes the `position` field, so the sort logic falls back to deadline-based ordering.
// All other tasks keep their manual positions.
function resetTaskPosition(id) {
    const items = getDB();
    const item = items.find(i => i.id === id);
    if (!item) return;
    // Delete the position field - sort will use deadline as fallback
    try { delete item.position; } catch(e) {}
    item.position = undefined;
    setDB(items);
    // Close expanded state so the task visibly moves to its new position
    expandedId = null;
    // Full re-render with SortableJS re-init
    fullRender();
    showToast('↩ به جای اصلی برگشت');
    if (navigator.vibrate) navigator.vibrate(20);
}

// Reset tasks' positions (restore natural deadline-based order).
// Per-group: only resets tasks in the CURRENT group (currentGroupId),
// not all groups globally. The button is disabled on the groups list view
// (currentView === 'groups') and in the "همه کارها" group — there's no
// manual ordering to reset in either of those cases.
function resetAllTaskPositions() {
    // Refuse if disabled (main page or 'all' group). The CSS already
    // blocks pointer events, but this is a defensive check.
    if (currentView === 'groups' || currentGroupId === 'all' || !currentGroupId) {
        showToast('در این صفحه بازگردانی کار نمی‌کند');
        return;
    }
    if (!confirm('تسک‌های این گروه به ترتیب اصلی (بر اساس سررسید) برگردانده شوند؟')) return;
    const items = getDB();
    // Only clear positions + pinned flag for tasks in the current group.
    // This un-pins manually-dragged tasks too, so everything goes back to
    // deadline-based ordering.
    items.forEach(item => {
        if (item.groupId === currentGroupId) {
            try { delete item.position; } catch(e) {}
            item.position = undefined;
            try { delete item.pinned; } catch(e) {}
            item.pinned = undefined;
        }
    });
    setDB(items);
    expandedId = null;
    fullRender();
    showToast('↩ تسک‌های این گروه به ترتیب اصلی برگشتند');
    if (navigator.vibrate) navigator.vibrate(30);
}

// ============ Render ============
let expandedId = null;
let currentView = 'groups'; // 'groups' or 'tasks'
let currentGroupId = null;

// ============ History / Mobile Back Button ============
// We use the History API so the mobile back button navigates inside the app
// instead of exiting:
//   - From the groups list (main page): back exits the app (nothing to pop).
//   - From a group's tasks view: back returns to the groups list.
//   - From an expanded task (task details): back returns to that group's tasks view.
//
// The history stack is managed via pushState/popstate. Each navigation
// pushes a new entry; pressing back triggers popstate which restores the
// previous view.

function navState() {
    return history.state || { view: 'groups' };
}

function navPush(state) {
    try { history.pushState(state, ''); } catch(e) {}
}

function navReplace(state) {
    try { history.replaceState(state, ''); } catch(e) {}
}

// Open a group's tasks view. Pushes a history entry so back returns to the
// groups list (or to the previous group, if the user navigated between groups).
function openGroupView(groupId) {
    currentView = 'tasks';
    currentGroupId = groupId;
    expandedId = null;
    navPush({ view: 'tasks', groupId: groupId });
    fullRender();
}

// Open a task's details (expands it). Pushes a history entry so back
// collapses the task instead of leaving the group.
function openTaskDetails(taskId) {
    expandedId = taskId;
    navPush({ view: 'tasks', groupId: currentGroupId, expandedId: taskId });
    render();
}

// Pop the top history entry. Used when collapsing an expanded task or going
// back from a tasks view. The popstate handler will re-render based on the
// now-current state.
function navBack() {
    try { history.back(); } catch(e) {}
}

// Helper: returns true if ANY modal overlay is currently open.
// Used by the popstate handler so the mobile back button closes an open
// modal BEFORE navigating the underlying view.
function isAnyModalOpen() {
    const ids = ['modalOverlay', 'calendarOverlay', 'datetimePickerOverlay'];
    for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.classList.contains('active')) return true;
    }
    return false;
}

// Track the order in which modals were opened. This lets the popstate
// handler close ONLY the topmost modal when several are stacked
// (e.g., the datetime picker is opened from inside the new-task form —
// pressing back should close just the datetime picker, not the form).
let _modalStack = [];

function trackModalOpen(type) {
    _modalStack.push(type);
}

function trackModalClose(type) {
    const idx = _modalStack.lastIndexOf(type);
    if (idx >= 0) _modalStack.splice(idx, 1);
}

// Visually close a single modal by its type marker ('calendar' | 'taskForm'
// | 'datetimePicker' | 'groupPicker' | 'groupDeleteConfirm'). Also performs
// side-effects specific to that modal (stop recording, reset edit-task flag).
function closeModalByType(type) {
    const overlayId = {
        'calendar': 'calendarOverlay',
        'taskForm': 'modalOverlay',
        'datetimePicker': 'datetimePickerOverlay',
        'groupPicker': 'groupPickerOverlay',
        'groupDeleteConfirm': 'groupDeleteConfirmOverlay',
    }[type];
    if (overlayId) {
        const el = document.getElementById(overlayId);
        if (el) el.classList.remove('active');
    }
    trackModalClose(type);
    if (type === 'taskForm') {
        // Stop recording if it was active
        if (typeof isRecording !== 'undefined' && isRecording) {
            try {
                isRecording = false;
                const addBtn = document.getElementById('addBtn');
                if (addBtn) addBtn.classList.remove('recording');
                if (typeof recognition !== 'undefined' && recognition) {
                    try { recognition.stop(); } catch(e) {}
                }
            } catch(e) {}
        }
        // Reset the edit-task flag (matches cancelModal behavior)
        if (typeof editTaskId !== 'undefined') editTaskId = null;
        const saveBtn = document.getElementById('saveBtn');
        if (saveBtn) saveBtn.textContent = 'ذخیره';
        // Clear the pending-group context (set by the calendar + flow) so a
        // later + press from outside the calendar doesn't accidentally reuse it.
        pendingTaskGroupId = null;
        pendingPrefilledDeadline = null;
    }
}

// popstate handler: this is the single source of truth for view restoration.
// Whenever the back button is pressed (mobile hardware, browser back, or
// history.back()), this fires and we re-render based on the new top state.
window.addEventListener('popstate', (e) => {
    const state = e.state || { view: 'groups' };

    // ===== Modal handling =====
    // If ANY modal is open, close ONLY the topmost one. This handles:
    //   1. Single modal open + back pressed → modal closes, underlying view stays.
    //   2. Nested modals (datetime picker inside task form) + back pressed →
    //      only the topmost (datetime picker) closes; the parent (task form)
    //      stays open. Pressing back again closes the parent.
    //   3. Modal closed via a BUTTON (e.g., user clicked "تأیید" on the
    //      datetime picker): the close function already removed the modal
    //      from _modalStack AND called navBack(). When popstate fires, the
    //      new state is the PARENT modal marker. We must NOT close the
    //      parent — it's still open and should stay open.
    //      Detection: state.view === 'modal' AND state.type === topType
    //      (the parent marker matches the modal still on top of _modalStack).
    if (_modalStack.length > 0) {
        const topType = _modalStack[_modalStack.length - 1];

        // CRITICAL FIX: if the new state is a modal marker whose type matches
        // the topmost open modal, it means the modal that was on top of
        // history was already closed manually (and removed from _modalStack)
        // — we just popped back to the parent marker. The parent modal
        // should stay open. Do NOT close anything.
        if (state.view === 'modal' && state.type === topType) {
            return;
        }

        // Otherwise, close the topmost modal — it was popped from history
        // (e.g., user pressed the hardware back button without first
        // manually closing it).
        closeModalByType(topType);

        // If the new state is a modal marker (parent modal), stay in modal
        // mode — don't navigate underneath, don't re-render.
        if (state.view === 'modal') {
            return;
        }

        // Otherwise, the new state is the underlying view (groups/tasks).
        // Fall through to the normal navigation below.
    }

    // ===== Normal navigation =====
    if (state.view === 'groups') {
        currentView = 'groups';
        currentGroupId = null;
        expandedId = null;
    } else if (state.view === 'tasks') {
        currentView = 'tasks';
        currentGroupId = state.groupId || null;
        expandedId = state.expandedId || null;
    } else if (state.view === 'modal') {
        // Reached via forward button (rare). Don't navigate underneath.
        return;
    }
    fullRender();
});

function fullRender() {
    // Destroy BOTH Sortable instances (tasks + groups) before re-rendering.
    // This prevents "ghost" instances from interfering with the new render.
    if (sortableInstance) {
        try { sortableInstance.destroy(); } catch(e) {}
        sortableInstance = null;
    }
    if (groupsSortableInstance) {
        try { groupsSortableInstance.destroy(); } catch(e) {}
        groupsSortableInstance = null;
    }
    render();
    setTimeout(initSortable, 50);
}

function render() {
    // Toggle the + button's disabled state based on the current view.
    // On the groups list view, the + button is disabled (clicking it would
    // not know which group to assign the new task to). Inside a group's
    // tasks view, the + button is enabled.
    const addBtn = document.getElementById('addBtn');
    if (addBtn) {
        if (currentView === 'groups') {
            addBtn.classList.add('disabled');
        } else {
            addBtn.classList.remove('disabled');
        }
    }
    // Toggle the reset-order button (↩) disabled state:
    //   - On the groups list view (main page): disabled (no group context)
    //   - Inside the "همه کارها" group: disabled (read-only ordering)
    //   - Inside a custom group: enabled (per-group reset)
    const resetBtn = document.getElementById('resetOrderBtn');
    if (resetBtn) {
        if (currentView === 'groups' || currentGroupId === 'all') {
            resetBtn.classList.add('disabled');
        } else {
            resetBtn.classList.remove('disabled');
        }
    }

    if (currentView === 'groups') {
        renderGroupsView();
    } else {
        renderTasksView(currentGroupId);
    }
}

// ============ Groups List View ============
function renderGroupsView() {
    const container = document.getElementById('container');
    const groups = getGroups();
    const items = getDB();

    container.innerHTML = '';

    // "همه کارها" (green, always first — NOT draggable). We add a marker
    // class so the drag-drop Sortable can recognize it as a fixed item
    // and refuse to drag it or move items above it.
    const allDiv = document.createElement('div');
    allDiv.className = 'group-item group-item-fixed';
    allDiv.dataset.groupId = 'all';
    allDiv.style.background = 'linear-gradient(135deg, #4CAF50, #2E7D32)';
    allDiv.innerHTML = `<div class="group-item-row"><span class="group-name">📋 همه کارها</span><span class="group-count">${toPersianNumber(items.length)}</span></div>`;
    allDiv.onclick = () => openGroupView('all');
    container.appendChild(allDiv);

    // Other groups — draggable (re-orderable). The SortableJS instance
    // (initGroupsSortable, called from fullRender when currentView==='groups')
    // saves the new order to localStorage on drag-end.
    groups.filter(g => g.id !== 'all').forEach(group => {
        const count = items.filter(i => i.groupId === group.id).length;
        const div = document.createElement('div');
        div.className = 'group-item group-item-draggable';
        div.dataset.groupId = group.id;
        div.style.background = `linear-gradient(135deg, ${group.color}, ${group.color}DD)`;
        div.innerHTML = `<div class="group-item-row"><span class="group-name">${escapeHtml(group.name)}</span><span class="group-count">${toPersianNumber(count)}</span></div>`;
        div.onclick = () => openGroupView(group.id);
        container.appendChild(div);
    });

    // Add new group (gray with + on both sides)
    const addDiv = document.createElement('div');
    addDiv.className = 'group-item add-group';
    addDiv.style.background = 'linear-gradient(135deg, #9E9E9E, #757575)';
    addDiv.innerHTML = `<div class="group-item-row add-group-row"><span class="add-plus">+</span><span class="group-name">افزودن گروه جدید</span><span class="add-plus">+</span></div>`;
    addDiv.onclick = () => {
        const name = prompt('نام گروه جدید:');
        if (!name || !name.trim()) return;
        const gs = getGroups();
        addGroup(name.trim(), GROUP_COLORS[(gs.length - 1) % GROUP_COLORS.length]);
        fullRender();
        showToast('گروه ایجاد شد ✓');
    };
    container.appendChild(addDiv);
}

// ============ Tasks View ============
function renderTasksView(groupId) {
    const container = document.getElementById('container');
    const group = getGroupById(groupId);
    let items = getDB();
    if (groupId !== 'all') items = items.filter(i => i.groupId === groupId);

    // Sort: not-done first, then by deadline (past → future).
    // In the "همه کارها" group, we ALWAYS sort by deadline (ignore manual
    // drag-drop positions — that group is read-only for ordering).
    // In custom groups, manual drag-drop positions take precedence
    // (a manually-moved task stays where the user put it); tasks WITHOUT
    // a position fall back to deadline-based ordering.
    if (groupId === 'all') {
        items.sort((a, b) => {
            if (a.done !== b.done) return a.done ? 1 : -1;
            return new Date(a.deadline).getTime() - new Date(b.deadline).getTime();
        });
    } else {
        items.sort((a, b) => {
            if (a.done !== b.done) return a.done ? 1 : -1;
            const aPos = (typeof a.position === 'number') ? a.position : 999999;
            const bPos = (typeof b.position === 'number') ? b.position : 999999;
            if (aPos !== bPos) return aPos - bPos;
            return new Date(a.deadline).getTime() - new Date(b.deadline).getTime();
        });
    }

    container.innerHTML = '';

    // Back button + group title.
    // Layout (RTL): [◄ back] [TITLE ........flex:1........] [✎] [🗑] [(count pill)]
    // The count pill is at the far LEFT (matching the groups-list layout where
    // the count badge is on the left). The edit (✎) and delete (🗑) buttons
    // sit between the title and the count — close to the count (left side),
    // NOT on the right side near the title.
    // They are HIDDEN for the default "همه کارها" group.
    const header = document.createElement('div');
    header.className = 'group-tasks-header';
    header.style.background = `linear-gradient(135deg, ${group.color}, ${group.color}DD)`;
    const isDefaultGroup = group.id === 'all';
    const editBtnHtml = isDefaultGroup
        ? ''
        : `<button class="group-edit-btn" title="ویرایش نام گروه" onclick="editGroupName('${group.id}')">✎</button>`;
    const deleteBtnHtml = isDefaultGroup
        ? ''
        : `<button class="group-delete-btn" title="حذف گروه" onclick="startGroupDeleteFlow('${group.id}')">🗑</button>`;
    // Count as a pill badge (no parentheses — the badge IS the visual container).
    const countHtml = `<span class="group-task-count">${toPersianNumber(items.length)}</span>`;
    // Order: back → title (flex:1, pushes the rest to the left) → edit → delete → count
    header.innerHTML = `<button class="back-btn" onclick="goToGroups()" title="بازگشت">◄</button><span class="group-title">${escapeHtml(group.name)}</span>${editBtnHtml}${deleteBtnHtml}${countHtml}`;
    container.appendChild(header);

    if (items.length === 0) {

    items.forEach((item) => {
        const level = getUrgencyLevel(item.deadline, item.done);
