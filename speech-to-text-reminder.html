        const row = document.createElement('div');
        row.className = 'item-row';
        if (item.done) { const m = document.createElement('div'); m.className='item-done-mark'; m.textContent='✓'; row.appendChild(m); }
        const textEl = document.createElement('div'); textEl.className='item-text'; textEl.textContent=item.text; row.appendChild(textEl);
        // Group tag: show the task's group name as a colored badge — ONLY in
        // the "همه کارها" view (where all groups are mixed together). In a
        // specific group's view, every task belongs to the same group, so
        // the tag would be redundant.
        if (groupId === 'all') {
            const taskGroup = getGroupById(item.groupId || 'all');
            if (taskGroup && taskGroup.id !== 'all') {
                const tag = document.createElement('span');
                tag.className = 'item-group-tag';
                tag.style.background = taskGroup.color;
                tag.textContent = taskGroup.name;
                row.appendChild(tag);
            } else {
                // Default "all" group — show a green badge too
                const tag = document.createElement('span');
                tag.className = 'item-group-tag';
                tag.style.background = '#4CAF50';
                tag.textContent = 'همه کارها';
                row.appendChild(tag);
            }
        }
        const remEl = document.createElement('div'); remEl.className='item-remaining'; remEl.textContent=toPersianDigits(formatRemaining(item.deadline, item.done)); row.appendChild(remEl);

        const groups = getGroups();
        const groupOpts = groups.map(g => `<option value="${g.id}" ${g.id === (item.groupId || 'all') ? 'selected' : ''}>${escapeHtml(g.name)}</option>`).join('');

        const details = document.createElement('div');
        details.className = 'item-details';
        details.innerHTML = `
            <div class="detail-row"><span class="detail-label">ساخته شد:</span><span class="detail-value">${toPersianDigits(toJalaliFull(item.createdAt))}</span></div>
            <div class="deadline-box"><div class="detail-row"><span class="detail-label">سررسید:</span><span class="detail-value">${toPersianDigits(toJalaliFull(item.deadline))}</span></div><div class="detail-row"><span class="detail-label">روز سررسید:</span><span class="detail-value">${toJalaliLong(item.deadline)}</span></div></div>
            <div class="detail-row"><span class="detail-label">انجام شد:</span><span class="detail-value">${item.completedAt ? toPersianDigits(toJalaliFull(item.completedAt)) : 'هنوز انجام نشده'}</span></div>
            ${item.completedAt ? `<div class="detail-row"><span class="detail-label">روز انجام:</span><span class="detail-value">${toJalaliLong(item.completedAt)}</span></div>` : ''}
            <div class="detail-row group-selector-row"><span class="detail-label">گروه:</span><select class="group-selector" onchange="changeTaskGroup('${item.id}', this.value)">${groupOpts}</select></div>
            <div class="item-actions"><button class="action-btn" data-action="edit">✏️ ویرایش</button><button class="action-btn" data-action="toggle">${item.done ? '↩ بازگردانی' : '✓ انجام شد'}</button><button class="action-btn danger" data-action="delete">🗑 حذف</button></div>
        `;
        div.appendChild(row);
        div.appendChild(details);
        div.addEventListener('click', (e) => {
            const action = e.target.dataset.action;
            if (action === 'toggle') { e.stopPropagation(); toggleDone(item.id); return; }
            if (action === 'delete') { e.stopPropagation(); deleteItem(item.id); return; }
            if (action === 'edit') { e.stopPropagation(); editTask(item.id); return; }
            if (e.target.closest('.action-btn') || e.target.closest('.group-selector')) return;
            toggleExpand(item.id);
        });
        container.appendChild(div);
    });
    setTimeout(initSortable, 0);
}

function goToGroups() {
    // If we're inside a group's tasks view, use history.back() so that
    // popstate restores the previous (groups) view. This makes the in-app
    // ◄ back button behave exactly like the mobile hardware back button.
    if (currentView === 'tasks') {
        navBack();
        return;
    }
    currentView = 'groups';
    currentGroupId = null;
    expandedId = null;
    fullRender();
}

function changeTaskGroup(taskId, newGroupId) {
    const items = getDB();
    const item = items.find(i => i.id === taskId);
    if (item) { item.groupId = newGroupId; setDB(items); setTimeout(() => fullRender(), 100); showToast('گروه تغییر کرد'); }
}

function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

function toggleExpand(id) {
    if (expandedId === id) {
        // Currently expanded → collapse. Use history.back() so popstate
        // re-renders without expansion and the mobile back button behaves
        // identically to collapsing via tap.
        navBack();
    } else if (expandedId === null) {
        // Expanding from collapsed → push a new history entry so that
        // back returns to the collapsed tasks view.
        openTaskDetails(id);
    } else {
        // Switching from one expanded task to another: just replace the
        // current history entry (no extra back-press needed to leave).
        expandedId = id;
        navReplace({ view: 'tasks', groupId: currentGroupId, expandedId: id });
        render();
    }
}

function toggleDone(id) {
    const items = getDB();
    const item = items.find(i => i.id === id);
    if (!item) return;

    // Toggle done state
    item.done = !item.done;

    if (item.done) {
        // Set completion date/time at the moment of clicking "Done"
        item.completedAt = new Date().toISOString();
    } else {
        // EXPLICITLY clear all completion-related fields when reverting.
        // Use BOTH delete AND = null to be absolutely sure the field is cleared.
        // This handles edge cases where one method might fail (e.g., object frozen,
        // prototype chain issues, or stale cached objects).
        try { delete item.completedAt; } catch(e) {}
        item.completedAt = null;
        // Also remove any legacy "completedAt" variants that might exist
        if ('completedAt' in item && item.completedAt) {
            // Force-clear if somehow still set
            item.completedAt = null;
        }
    }

    // Verify the change took effect before saving
    if (!item.done) {
        // Double-check: completedAt must be falsy
        if (item.completedAt) {
            console.warn('Failed to clear completedAt, forcing null');
            item.completedAt = null;
        }
    }

    setDB(items);
    fullRender();
    showToast(item.done ? 'انجام شد ✓' : 'بازگردانی شد');
}

function deleteItem(id) {
    const items = getDB();
    const item = items.find(i => i.id === id);
    // If this is a PARENT task, also delete all its children
    const childCount = items.filter(i => i.parentId === id).length;
    const msg = childCount > 0
        ? `این تسک و ${childCount} تسک تکرارشونده‌ی آن حذف شوند؟`
        : 'این یادآور حذف شود؟';
    if (!confirm(msg)) return;
    let newItems = items.filter(i => i.id !== id && i.parentId !== id);
    setDB(newItems);
    if (expandedId === id) {
        expandedId = null;
        navBack();
    } else {
        fullRender();
    }
    showToast(childCount > 0 ? `تسک و ${childCount} تکرار حذف شد` : 'حذف شد');
}

// ============ Save Backup to Local Storage Only ============
// Saves the database + HTML program file to the Downloads folder.
// Does NOT use navigator.share (no social media sharing).
// The user explicitly said: "بکاپ گرفتن هم فقط روی فضای ذخیره سازی باشد به شبکه های اجتماعی نمی خواهد بفرستد"
function saveBackupToLocal() {
    const items = getDB();
    const customGroups = getGroups().filter(g => g.id !== 'all');
    const dbContent = JSON.stringify({
        // Backup format version history:
        //   v1 (legacy) — just an array of items
        //   v2 — { items, groups } wrapper
        //   v3 — added exportedAt, count, groupsCount, exportedAtJalali
        //   v4 — preserves all new schema fields (parentId, repeat, pinned,
        //        position, completedAt) for full round-trip backup/restore.
        //        The migrateItemsSchema() function on import handles all
        //        versions gracefully (including v1-v3 backups).
        version: 4,
        exportedAt: new Date().toISOString(),
        exportedAtJalali: toJalaliLong(new Date()),
        count: items.length,
        groupsCount: customGroups.length,
        groups: customGroups,
        items: items
    }, null, 2);
    const dbBlob = new Blob([dbContent], { type: 'application/json' });
    // Filename: YadAvar_YYYYMMDDHHmm.json where the date/time is Jalali (Shamsi).
    // Example: 1405/08/05 12:30 → YadAvar_140508051230.json
    const now = new Date();
    const [jy, jm, jd] = toJalaliParts(now);
    const ts = `${jy}${pad2(jm)}${pad2(jd)}${pad2(now.getHours())}${pad2(now.getMinutes())}`;
    const dbFileName = `YadAvar_${ts}.json`;
    // Download the database file to Downloads folder
    downloadBlob(dbBlob, dbFileName);
    showToast('بک‌آپ ذخیره شد ✓ (Downloads/' + dbFileName + ')');
}

    // DEPRECATED — replaced by saveBackupToLocal (no social media sharing).

    saveBackupToLocal();

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ============ Import Database ============
function importDatabase() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.style.display = 'none';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = JSON.parse(event.target.result);
                let importedItems = [];
                let importedGroups = [];

                // Support both { items: [...] } wrapper and raw [...]
                if (Array.isArray(data)) {
                    // v1 (legacy) backup: just an array of items, no groups
                    importedItems = data;
                } else if (data && Array.isArray(data.items)) {
                    importedItems = data.items;
                    // v2+ backup: includes a `groups` array of custom groups
                    if (Array.isArray(data.groups)) {
                        importedGroups = data.groups;
                    }
                } else {
                    throw new Error('ساختار فایل نامعتبر است');
                }

                // Validate imported groups — strip the 'all' group if present
                // (it's auto-created on this device and shouldn't be duplicated).
                const validImportedGroups = (importedGroups || [])
                    .filter(g => g && g.id && g.name && g.id !== 'all')
                    .map(g => ({
                        id: String(g.id),
                        name: String(g.name),
                        color: g.color ? String(g.color) : '#607D8B',
                        isDefault: false,
                    }));

                // CRITICAL: Build the SET of valid group IDs FIRST so the
                // migration function can validate task groupIds against it.
                // This combines existing groups (if merge) + imported groups.
                // For REPLACE mode, this is built later (before setDB).
                // For now, we just pre-validate the items via migrateItemsSchema
                // WITHOUT the groupIds check — that's done after we know the mode.
                // First pass: just normalize each item's shape (preserve
                // parentId, repeat, pinned, position, completedAt).
                const normalizedItems = migrateItemsSchema(importedItems, null);

                if (normalizedItems.length === 0) {
                    showToast('هیچ یادآور معتبری در فایل یافت نشد');
                    return;
                }

                const currentItems = getDB();
                const existingIds = new Set(currentItems.map(i => i.id));
                const newItems = normalizedItems.filter(i => !existingIds.has(i.id));
                const dupCount = normalizedItems.length - newItems.length;

                // Build dialog message
                const groupsLine = validImportedGroups.length > 0
                    ? `فایل شامل ${validImportedGroups.length} گروه سفارشی است\n`
                    : '';
                const msg = `فایل دارای ${normalizedItems.length} یادآور است.\n` +
                    groupsLine +
                    `دیتابیس فعلی: ${currentItems.length} مورد\n` +
                    (dupCount > 0 ? `${dupCount} مورد تکراری (با همان شناسه) شناسایی شد\n` : '') +
                    `\nبرای «ادغام» (افزودن موارد جدید + گروه‌ها) = بله\n` +
                    `برای «جایگزینی کامل» = خیر`;

                if (confirm(msg)) {
                    // ===== MERGE MODE =====
                    // 1. Merge groups: add any imported custom groups whose id
                    //    doesn't already exist on this device.
                    const currentGroups = getGroups();
                    const existingGroupIds = new Set(currentGroups.map(g => g.id));
                    const newGroupsToAdd = validImportedGroups.filter(g => !existingGroupIds.has(g.id));
                    if (newGroupsToAdd.length > 0) {
                        setGroups([...currentGroups, ...newGroupsToAdd]);
                    }

                    // 2. Build the set of valid group IDs after merge, so we can
                    //    re-validate each task's groupId. Any orphaned task
                    //    (whose group was deleted on this device) is sent to 'all'.
                    const finalGroups = getGroups();
                    const finalGroupIds = new Set(finalGroups.map(g => g.id));
                    // Re-run migration with the final group IDs — this ensures
                    // orphan tasks go to 'all' and parentIds are re-validated
                    // against the NEW merged set.
                    const fixedItems = migrateItemsSchema(newItems, finalGroupIds);
                    // Also re-validate existing items' parentIds against the
                    // merged set (an existing child might reference a newly
                    // imported parent — that's fine, the link is now valid).
                    const mergedSet = [...currentItems, ...fixedItems];
                    const allIds = new Set(mergedSet.map(i => i.id));
                    // Just clean up orphan parentIds on existing items (rare, but safe)
                    const cleanedCurrent = currentItems.map(item => {
                        if (item.parentId && !allIds.has(item.parentId)) {
                            const { parentId, ...rest } = item;
                            return rest;
                        }
                        return item;
                    });

                    // 3. Merge tasks: existing items untouched, new items appended.
                    const merged = [...cleanedCurrent, ...fixedItems];
                    setDB(merged);  // always saves to IDB + OPFS (no downloads)
                    fullRender();
                    const taskCount = fixedItems.length;
                    const groupCount = newGroupsToAdd.length;
                    const parts = [`${taskCount} یادآور جدید اضافه شد`];
                    if (groupCount > 0) parts.push(`${groupCount} گروه جدید اضافه شد`);
                    showToast(parts.join('، ') + ' ✓');
                } else {
                    // ===== REPLACE MODE =====
                    if (confirm(`دیتابیس فعلی (${currentItems.length} مورد) با ${normalizedItems.length} مورد جدید جایگزین شود؟`)) {
                        // 1. Replace groups: always start with the default 'all'
                        //    group, then append all imported custom groups.
                        const replacedGroups = [
                            { id: 'all', name: 'همه کارها', color: '#4CAF50', isDefault: true },
                            ...validImportedGroups
                        ];
                        setGroups(replacedGroups);

                        // 2. Re-validate task groupIds against the new groups.
                        //    Use the full migration function so all fields
                        //    (parentId, repeat, pinned, position, completedAt)
                        //    are preserved and orphan parentIds are cleaned up.
                        const replacedGroupIds = new Set(replacedGroups.map(g => g.id));
                        const fixedItems = migrateItemsSchema(normalizedItems, replacedGroupIds);

                        setDB(fixedItems);  // always saves to IDB + OPFS (no downloads)
                        // Clear sent notifications for items no longer present
                        clearSentNotificationsFor(fixedItems);
                        fullRender();
                        const taskCount = fixedItems.length;
                        const groupCount = validImportedGroups.length;
                        const parts = ['دیتابیس جایگزین شد'];
                        if (groupCount > 0) parts.push(`${groupCount} گروه بازگردانده شد`);
                        showToast(parts.join('، ') + ' ✓');
                    }
                }
            } catch(e) {
                console.error('Import error:', e);
                showToast('خطا در خواندن فایل: ' + (e.message || 'نامشخص'));
            }
        };
        reader.onerror = () => showToast('خطا در خواندن فایل');
        reader.readAsText(file);
    };
    document.body.appendChild(input);
    input.click();
    document.body.removeChild(input);
}

// ============ Notifications ============
const NOTIF_KEY = 'sent_notifications_v1';
let sentNotifications = new Set();

async function loadSentNotifications() {
    // Load from IndexedDB (shared with SW)
    const entries = await idbGetAllNotifLog();
    if (entries.length > 0) {
        sentNotifications = new Set(entries.map(e => e.key));
        // Also merge with legacy localStorage entries (one-time)
        try {
            const legacy = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]');
            legacy.forEach(k => sentNotifications.add(k));
            if (legacy.length > 0) {
                localStorage.removeItem(NOTIF_KEY);
            }
        } catch(e) {}
    } else {
        // Fallback: try localStorage legacy
        try {
            const saved = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]');
            sentNotifications = new Set(saved);
        } catch(e) { sentNotifications = new Set(); }
    }
}

async function saveSentNotifications() {
    // Save to localStorage as fallback (primary store is IndexedDB, written per-notif via idbPutNotifLog)
    try {
        if (sentNotifications.size > 500) {
            const arr = [...sentNotifications];
            sentNotifications = new Set(arr.slice(-500));
        }
        localStorage.setItem(NOTIF_KEY, JSON.stringify([...sentNotifications]));
    } catch(e) { console.error('Failed to save notifications', e); }
}

function clearSentNotificationsFor(items) {
    const validIds = new Set(items.map(i => i.id));
    const toRemove = [...sentNotifications].filter(key => {
        const id = key.split('_')[0];
        return !validIds.has(id);
    });
    toRemove.forEach(k => sentNotifications.delete(k));
    saveSentNotifications();
    // Note: IDB entries for deleted items will be cleaned up by SW's periodic cleanup
}

// Notification thresholds: at X minutes remaining, send once
const NOTIF_THRESHOLDS = [
    { minutes: 60 * 24, key: 'd1', label: '۱ روز' },     // 1 day before
    { minutes: 60 * 6,  key: 'h6', label: '۶ ساعت' },     // 6 hours before
    { minutes: 60,      key: 'h1', label: '۱ ساعت' },     // 1 hour before
    { minutes: 30,      key: 'm30', label: '۳۰ دقیقه' }, // 30 min before
    { minutes: 10,      key: 'm10', label: '۱۰ دقیقه' },  // 10 min before
    { minutes: 0,       key: 'due', label: 'سررسید' },    // at deadline
];

function checkNotifications() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const items = getDB();
    const now = Date.now();

    items.forEach(item => {
        if (item.done) return;
        const deadlineMs = new Date(item.deadline).getTime();
        if (isNaN(deadlineMs)) return;
        const remaining = deadlineMs - now;

        NOTIF_THRESHOLDS.forEach(t => {
            const triggerMs = t.minutes * 60 * 1000;
            const notifKey = `${item.id}_${t.key}`;
            if (sentNotifications.has(notifKey)) return;

            // Send if remaining <= triggerMs AND not too far past (within 60 min window)
            if (remaining <= triggerMs && remaining > triggerMs - 60 * 60 * 1000) {
                sendNotification(item, t.label, remaining <= 0);
                sentNotifications.add(notifKey);
                saveSentNotifications();
                // Also write to IndexedDB so SW doesn't duplicate in background
                idbPutNotifLog(notifKey);
            }
        });
    });
}

function sendNotification(item, label, isOverdue) {
    try {
        const text = item.text.length > 40 ? item.text.substring(0, 40) + '...' : item.text;
        const title = isOverdue
            ? `⚠️ سررسید گذشته: ${text}`
            : `${label} تا سررسید: ${text}`;
        const body = isOverdue
            ? `زمان انجام این یادآور گذشته است`
            : `یادآور شما نزدیک سررسید است`;
        const n = new Notification(title, {
            body: body,
            tag: item.id + '_' + label,
            dir: 'rtl',
            lang: 'fa-IR'
        });
        n.onclick = () => {
            window.focus();
            n.close();
            expandedId = item.id;
            render();
        };
    } catch(e) {
        console.error('Notification error:', e);
    }
}

// Cleanup old sent notifications (older than 30 days)
function cleanupOldNotifications() {
    const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
    const before = sentNotifications.size;
    // We can't easily tell when each was sent, so just trim if too large
    if (sentNotifications.size > 200) {
        const arr = [...sentNotifications];
        sentNotifications = new Set(arr.slice(-100));
        saveSentNotifications();
    }
}

// State: currently displayed year/month, and selected day

// Persian weekday short names - week starts on Saturday (شنبه)
const calWeekdayNames = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];

// Note: isJalaliLeap, getDaysInJalaliMonth, and jalaliToGregorian
// are already defined above in the Jalali Date Conversion section.

function openCalendar() {
    const today = new Date();
    const [jy, jm, jd] = toJalaliParts(today);
    calState = { year: jy, month: jm, selectedDay: jd };
    renderCalendar();
    document.getElementById('calendarOverlay').classList.add('active');
    // Push a modal marker so the mobile back button closes the calendar
    // instead of navigating underneath (or exiting the app).
    navPush({ view: 'modal', type: 'calendar' });
    trackModalOpen('calendar');
}

function closeCalendar() {
    // Visually close the calendar + remove from the modal stack.
    closeModalByType('calendar');
    // Pop the modal marker we pushed on openCalendar.
    navBack();
}

function changeMonth(delta) {
    let m = calState.month + delta;
    let y = calState.year;
    if (m > 12) { m = 1; y++; }
    if (m < 1) { m = 12; y--; }
    calState.month = m;
    calState.year = y;
    renderCalendar();
}

function goToToday() {
    const today = new Date();
    const [jy, jm, jd] = toJalaliParts(today);
    calState = { year: jy, month: jm, selectedDay: jd };
    renderCalendar();
}

function renderCalendar() {
    document.getElementById('calMonthYear').textContent =
        `${jalaliMonths[calState.month - 1]} ${toPersianNumber(calState.year)}`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    // Weekday header
    calWeekdayNames.forEach(w => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = w;
        grid.appendChild(el);
    });

    // Find weekday of day 1 of this Jalali month (Persian week starts Saturday)
    const firstDayG = jalaliToGregorian(calState.year, calState.month, 1);
    // getDay() returns 0=Sunday, 6=Saturday. Persian week: Sat=0, Sun=1, ..., Fri=6
    const jsDay = firstDayG.getUTCDay();
    const persianOffset = ((jsDay + 1) % 7); // Sat(6)→0, Sun(0)→1, Mon(1)→2, ..., Fri(5)→6

    // Collect tasks per day for this month
    const items = getDB();
    const tasksByDay = {};  // { dayNumber: Set of task IDs (unique) }

    function checkAndMark(item, dateStr) {
        if (!dateStr) return;
        const d = new Date(dateStr);
        const [jy, jm, jd] = toJalaliParts(d);
        if (jy === calState.year && jm === calState.month) {
            if (!tasksByDay[jd]) tasksByDay[jd] = new Set();
            tasksByDay[jd].add(item.id);
        }
    }

    items.forEach(item => {
        checkAndMark(item, item.deadline);
        checkAndMark(item, item.completedAt);
        checkAndMark(item, item.createdAt);
    });

    // Empty cells before day 1
    for (let i = 0; i < persianOffset; i++) {
        const el = document.createElement('div');
        el.className = 'cal-day other-month';
        grid.appendChild(el);
    }

    // Render days
    const daysInMonth = getDaysInJalaliMonth(calState.year, calState.month);
    const today = new Date();
    const [todayJy, todayJm, todayJd] = toJalaliParts(today);

    for (let day = 1; day <= daysInMonth; day++) {
        const el = document.createElement('button');
        el.className = 'cal-day';
        if (day === todayJd && calState.month === todayJm && calState.year === todayJy) {
            el.classList.add('today');
        }
        if (day === calState.selectedDay) {
            el.classList.add('selected');
        }
        if (tasksByDay[day] && tasksByDay[day].size > 0) {
            el.classList.add('has-tasks');
        }
        el.textContent = toPersianDigits(day);
        el.onclick = () => selectCalendarDay(day);
        grid.appendChild(el);
    }

    renderCalendarDayTasks();
}

function selectCalendarDay(day) {
    calState.selectedDay = day;
    renderCalendar();
}

function getTaskTypeLabel(t) {
    switch(t) {
        case 'deadline': return 'سررسید';
        case 'completed': return 'انجام شد';
        case 'created': return 'ایجاد شد';
        default: return '';
    }
}

function getTaskPriority(item, types) {
    const hasDeadlineToday = types.includes('deadline');
    const hasCompletedToday = types.includes('completed');
    const isDone = !!item.done;

    if (hasDeadlineToday && !isDone) return 0;  // سررسید امروز، انجام‌نشده (فوراً)
    if (hasDeadlineToday && isDone) return 1;   // سررسید امروز، انجام‌شده
    if (hasCompletedToday && !hasDeadlineToday) return 2;  // امروز انجام شده، سررسید روز دیگر
    if (types.includes('created')) return 3;   // فقط امروز ایجاد شده
    return 4;
}

function getPriorityLabel(prio) {
    switch(prio) {
        case 0: return '⛔ سررسید امروز - نیازمند توجه';
        case 1: return '✅ سررسید امروز - انجام شد';
        case 2: return '✓ امروز انجام شد';
        case 3: return '📌 امروز ایجاد شد';
        default: return '';
    }
}

function getTaskDisplayTime(item, types) {
    // Earliest matching event time for sorting/display
    const times = [];
    if (types.includes('deadline') && item.deadline) times.push(new Date(item.deadline).getTime());
    if (types.includes('completed') && item.completedAt) times.push(new Date(item.completedAt).getTime());
    if (types.includes('created') && item.createdAt) times.push(new Date(item.createdAt).getTime());
    if (times.length === 0) return new Date();
    return new Date(Math.min(...times));
}

function renderCalendarDayTasks() {
    const container = document.getElementById('calendarDayTasks');
    if (!calState.selectedDay) {
        container.innerHTML = '<div class="cal-empty">یک روز را انتخاب کنید</div>';
        return;
    }

    const items = getDB();
    // Each entry: { item, types: ['deadline', 'completed', 'created'] }
    // A task appears only ONCE per day, with all matching types in one row
    const tasksForDay = [];

    function jalaliMatches(dateStr) {
        if (!dateStr) return false;
        const d = new Date(dateStr);
        const [jy, jm, jd] = toJalaliParts(d);
        return jy === calState.year && jm === calState.month && jd === calState.selectedDay;
    }

    items.forEach(item => {
        const types = [];
        if (jalaliMatches(item.deadline)) types.push('deadline');
        if (jalaliMatches(item.completedAt)) types.push('completed');
        if (jalaliMatches(item.createdAt)) types.push('created');

        // Safety net: if the task is marked done (item.done === true) AND
        // its deadline matches the selected day, we should display the "completed" tag
        // even if completedAt is missing (stale data from older versions) or
        // was recorded on a different day (the task is still considered "done"
        // from the deadline-day perspective).
        if (item.done && jalaliMatches(item.deadline) && !types.includes('completed')) {
            types.push('completed');
        }

        if (types.length > 0) {
            tasksForDay.push({ item, types });
        }
    });

    if (tasksForDay.length === 0) {
        container.innerHTML = `<div class="cal-empty">هیچ کاری برای روز ${toPersianDigits(calState.selectedDay)} ${jalaliMonths[calState.month - 1]} ثبت نشده است</div>`;
        return;
    }

    // Sort: first by priority (deadline-not-done first, created-only last), then by time
    tasksForDay.sort((a, b) => {
        const aPrio = getTaskPriority(a.item, a.types);
        const bPrio = getTaskPriority(b.item, b.types);
        if (aPrio !== bPrio) return aPrio - bPrio;
        // Within same priority, sort by earliest matching time
        const aTime = getTaskDisplayTime(a.item, a.types).getTime();
        const bTime = getTaskDisplayTime(b.item, b.types).getTime();
        return aTime - bTime;
    });

    container.innerHTML = `<div class="cal-tasks-header">کارهای روز ${toPersianDigits(calState.selectedDay)} ${jalaliMonths[calState.month - 1]} (${toPersianDigits(tasksForDay.length)} مورد)</div>`;

    let lastPriority = -1;
    tasksForDay.forEach(({ item, types }) => {
        const prio = getTaskPriority(item, types);

        // Add group header when priority changes
        if (prio !== lastPriority) {
            const header = document.createElement('div');
            header.className = 'cal-group-header prio-' + prio;
            header.textContent = getPriorityLabel(prio);
            container.appendChild(header);
            lastPriority = prio;
        }

        const time = getTaskDisplayTime(item, types);
        const timeStr = `${pad2(time.getHours())}:${pad2(time.getMinutes())}`;

        // Build all labels for this task in one row
        const labels = types.map(t =>
            `<span class="cal-task-type ${t}">${getTaskTypeLabel(t)}</span>`
        ).join('');

        const div = document.createElement('div');
        div.className = 'cal-task';
        // Group badge: a small colored pill showing the task's group name.
        // Shown for EVERY task (including the default "همه کارها" group) so
        // the user can always see at-a-glance which group each calendar task
        // belongs to. If the task's groupId is missing (legacy data), it
        // falls back to the default "all" group via getGroupById.
        const taskGroup = getGroupById(item.groupId || 'all');
        const groupTagHtml =
            `<span class="cal-task-group" style="background: ${taskGroup.color};">${escapeHtml(taskGroup.name)}</span>`;
        div.innerHTML = `
            <span class="cal-task-time">${toPersianDigits(timeStr)}</span>
            <span class="cal-task-types">${labels}</span>
            <span class="cal-task-text">${escapeHtml(item.text)}</span>
            ${groupTagHtml}
        `;
        div.onclick = () => {
            // Clicking a calendar task: switch underlying view to that
            // task's group, expand the task, and REPLACE the calendar modal
            // state with the new task-expansion state. This way pressing back
            // from the expanded task returns the user to whatever view was
            // active BEFORE the calendar was opened (groups or another group's
            // tasks list), not to a closed calendar.
            const taskGroupId = item.groupId || 'all';

            // 1. Visually close the calendar WITHOUT calling closeCalendar()
            //    (which would call navBack and pop the modal state — we want
            //    to REPLACE that state instead). But we DO need to remove the
            //    calendar from the modal stack so the popstate handler knows
            //    no modal is open anymore.
            closeModalByType('calendar');

            // 2. Switch the underlying view + expand the task
            currentView = 'tasks';
            currentGroupId = taskGroupId;
            expandedId = item.id;

            // 3. Replace the current top-of-history (the calendar modal marker)
            //    with the new task-expansion state.
            navReplace({ view: 'tasks', groupId: taskGroupId, expandedId: item.id });

            // 4. Render + scroll the task into view
            fullRender();
            setTimeout(() => {
                const el = document.querySelector(`.item[data-id="${item.id}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 200);
        };
        container.appendChild(div);
    });
}

// ============ Service Worker Registration ============
async function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) {
        console.warn('Service Worker not supported');
        return false;
    }
    try {
        // Service Workers require HTTPS or localhost - check protocol
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            console.warn('SW requires HTTPS or localhost, current:', location.protocol, location.hostname);
            return false;
        }
        const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        console.log('[Page] SW registered:', reg.scope);

        // Auto-update: if a new SW is waiting to activate, force it to take over immediately.
        // This ensures users always get the latest version without manual cache clearing.
        if (reg.waiting) {
            console.log('[Page] New SW waiting, sending SKIP_WAITING');
            reg.waiting.postMessage('SKIP_WAITING');
        }
        reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            if (newSW) {
                newSW.addEventListener('statechange', () => {
                    if (newSW.state === 'installed' && reg.waiting) {
                        // New SW installed and waiting - activate it immediately
                        console.log('[Page] New SW installed, activating...');
                        reg.waiting.postMessage('SKIP_WAITING');
                    }
                    if (newSW.state === 'activated') {
                        setupPeriodicSync(reg);
                    }
                });
            }
        });

        // Also listen for controller change (when new SW takes over)
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[Page] SW controller changed - reloading to apply updates');
            // Reload to get the new code from the updated SW cache.
            // This is critical: without the reload, the page runs OLD code
            // (from the previous SW's cache) even after the new SW activates.
            if (!isRecording) {
                window.location.reload();
            }
        });

        // Wait for SW to be active
        if (reg.active) {
            await setupPeriodicSync(reg);
        }
        return true;
    } catch(e) {
        console.error('[Page] SW registration failed:', e);
        return false;
    }
}

async function setupPeriodicSync(registration) {
    if (!('periodicSync' in registration)) {
        console.warn('[Page] Periodic Background Sync not supported');
        return;
    }
    try {
        // Check current permission status
        const status = await navigator.permissions.query({ name: 'periodic-background-sync' }).catch(() => null);
        if (status && status.state !== 'granted') {
            console.warn('[Page] Periodic sync permission not granted:', status.state);
            return;
        }
        // Register periodic sync (minimum interval 1 day in Chrome)
        await registration.periodicSync.register('check-deadlines', {
            minInterval: 12 * 60 * 60 * 1000  // 12 hours
        });
        console.log('[Page] Periodic sync registered');
    } catch(e) {
        console.warn('[Page] Periodic sync registration failed:', e);
    }
}

// Listen for messages from SW (e.g., expand a reminder after notification click)
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (event) => {
        console.log('[Page] Message from SW:', event.data);
        if (!event.data) return;
        if (event.data.type === 'expand-reminder' && event.data.id) {
            expandedId = event.data.id;
            render();
            // Scroll to the item
            setTimeout(() => {
                const el = document.querySelector(`.item[data-id="${event.data.id}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 200);
        }
        // CRITICAL: SW activates a new version → reload the page so the user
        // gets the new SW fetch strategy + fresh HTML. This is the safety net
        // in case controllerchange doesn't fire (rare, but happens on some
        // mobile browsers).
        if (event.data.type === 'RELOAD_PLEASE') {
            console.log('[Page] SW requested reload (version=' + event.data.version + ')');
            if (!isRecording) {
                window.location.reload();
            } else {
                // Defer reload until recording stops
                console.log('[Page] Recording in progress — deferring reload');
                window._pendingReload = true;
            }
        }
    });
}

// ============ Real Reachability Detection ============
// Performs a REAL network request to verify internet connectivity.
// Uses a special '_rc' query parameter that tells the Service Worker to
// BYPASS its cache and always go to the network.
// This catches:
//   - VPN connected but can't reach GitHub Pages
//   - DNS issues
//   - Restrictive firewalls
//   - Slow/unstable connections (timeout)
//   - GitHub itself being down
//   - Intermittent connectivity

let isReachable = true; // assume reachable initially (avoid unnecessary flashing on load)
let lastReachabilityCheck = 0;
let reachabilityCheckInProgress = false;
const REACHABILITY_CHECK_INTERVAL = 5000; // 5 seconds — the user wants frequent checks
const REACHABILITY_TIMEOUT = 4000; // 4 seconds timeout (was 5s - stricter)
// Endpoints to test for REAL internet reachability.
// The program's own HTML file on GitHub Pages is the PRIMARY test — if this
// is reachable, the user can access the program online. The manifest.json
// is a secondary same-origin test. The CDN is a tertiary cross-origin test.
// If ALL fail, the user is truly offline (VPN with no real connectivity,
// quota exhausted, DNS issues, firewall, GitHub down, etc.) and the header
// flashes blue-yellow.
const REACHABILITY_ENDPOINTS = [
    './speech-to-text-reminder.html',  // PRIMARY: the program file itself (GitHub Pages)
    './manifest.json',                  // SECONDARY: same-origin (GitHub Pages)
    'https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js',  // TERTIARY: external CDN
];

async function checkReachability(force = false) {
    const now = Date.now();
    // Don't check too often (unless forced)
    if (!force && now - lastReachabilityCheck < REACHABILITY_CHECK_INTERVAL) {
        return isReachable;
    }
    if (reachabilityCheckInProgress) {
        return isReachable;
    }
    reachabilityCheckInProgress = true;
    lastReachabilityCheck = now;

    // If navigator says offline, definitely not reachable
    if (!navigator.onLine) {
        const wasReachable = isReachable;
        isReachable = false;
        if (wasReachable) updateOnlineStatus();
        reachabilityCheckInProgress = false;
        return false;
    }

    // Try multiple endpoints - if ANY succeeds, we're online
    // If ALL fail, we're offline (or have bad connectivity)
    let anySuccess = false;

    for (const endpoint of REACHABILITY_ENDPOINTS) {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), REACHABILITY_TIMEOUT);

            // Use _rc parameter to tell SW to bypass cache
            // Use cache: 'no-store' as additional browser-level cache bypass
            // Use HEAD method (no body needed, just checking connectivity)
            const separator = endpoint.includes('?') ? '&' : '?';
            const checkUrl = endpoint + separator + '_rc=1&_=' + now;

            const response = await fetch(checkUrl, {
                method: 'HEAD',
                cache: 'no-store',
                signal: controller.signal,
                redirect: 'follow'
            });
            clearTimeout(timeoutId);

            // Check response:
            // - response.ok (status 200-299) = real success from network
            // - response.status === 503 = SW's offline fallback (network failed)
            // - response.type === 'opaque' = cross-origin no-cors (network succeeded)
            if (response.ok || response.status === 0 || response.type === 'opaque') {
                anySuccess = true;
                break; // one endpoint is enough - we're online
            }
            // If status is 503, the SW caught a network failure - try next endpoint
        } catch(e) {
            // Network error, timeout, or aborted - try next endpoint
            console.warn('[Reachability] Endpoint failed:', endpoint, e.name || e.message);
        }
    }

    const wasReachable = isReachable;
    isReachable = anySuccess;
    if (wasReachable !== isReachable) {
        updateOnlineStatus();
        // If we just transitioned from OFFLINE to ONLINE (GitHub reachable
        // again), automatically clear the Service Worker cache and reload
        // the page from the network. This ensures the user gets the latest
        // online version from GitHub, not a stale cached offline copy.
        if (!wasReachable && isReachable) {
            console.log('[Reachability] Transition: offline → online. Clearing SW cache & reloading...');
            clearSWCacheAndReload();
        }
    }

    reachabilityCheckInProgress = false;
    return isReachable;
}

// Clear all Service Worker caches and reload the page from the network.
// Called when transitioning from offline to online — ensures the user gets
// the latest GitHub version, not a stale cached copy.
function clearSWCacheAndReload() {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
        // No SW controller — just reload
        console.log('[clearSWCacheAndReload] No SW controller, reloading...');
        location.reload();
        return;
    }
    // Listen for the SW's CACHE_CLEARED confirmation message
    let reloaded = false;
    const handler = (e) => {
        if (e.data && e.data.type === 'CACHE_CLEARED') {
            console.log('[clearSWCacheAndReload] SW confirmed cache cleared, reloading...');
            navigator.serviceWorker.removeEventListener('message', handler);
            if (!reloaded) {
                reloaded = true;
                // Use a cache-busting URL to force a network fetch on reload
                location.reload();
            }
        }
    };
    navigator.serviceWorker.addEventListener('message', handler);
    // Send CLEAR_CACHE message to the SW
    navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
    console.log('[clearSWCacheAndReload] Sent CLEAR_CACHE to SW');
    // Fallback: reload after 2 seconds even if SW doesn't confirm
    setTimeout(() => {
        if (!reloaded) {
            console.log('[clearSWCacheAndReload] Fallback: reloading after timeout');
            reloaded = true;
            location.reload();
        }
    }, 2000);
}

// ============ Online/Offline Detection ============
// Silent detection: only flash the header background (blue <-> yellow) when offline.
// Uses real reachability check (not just navigator.onLine) to detect:
//   - VPN connected but GitHub not reachable
//   - DNS issues
//   - Restrictive firewalls
//   - GitHub itself being down
function updateOnlineStatus() {
    const isOnline = isReachable; // use real reachability, not navigator.onLine
    const header = document.querySelector('.header');
    if (header) {
        if (isOnline) {
            header.classList.remove('offline');
        } else {
            header.classList.add('offline');
        }
    }
    return isOnline;
}

// Silent reconciliation: ensure IDB is in sync with localStorage.
// localStorage is always the source of truth (the page always reads from it).
// IDB is just a mirror for the Service Worker's background notifications.
// This function is called on page load and on online/offline transitions.
async function reconcileDatabase() {
    try {
        const localItems = getDB();
        const idbItems = await idbGetAllReminders();
        // Re-sync if counts differ or IDs don't match
        const localIds = new Set(localItems.map(i => i.id));
        const idbIds = new Set(idbItems.map(i => i.id));
        const staleInIdb = [...idbIds].filter(id => !localIds.has(id));
        const missingInIdb = [...localIds].filter(id => !idbIds.has(id));
        if (staleInIdb.length > 0 || missingInIdb.length > 0 || idbItems.length !== localItems.length) {
            console.log(`[Page] Reconciling DB: localStorage=${localItems.length}, IDB=${idbItems.length}, stale=${staleInIdb.length}, missing=${missingInIdb.length}`);
            await idbBulkPutReminders(localItems);
        }
    } catch(e) {
        console.warn('Reconciliation failed:', e);
    }
}

// ============ Init ============
document.addEventListener('DOMContentLoaded', async () => {
    initRecognition();
    updateHeaderDate();

    // Real reachability detection - SILENT (no toasts)
    // Only flashes the header (blue <-> yellow) and silently reconciles the database
    // Uses actual HEAD request to verify GitHub Pages is reachable
    // (not just navigator.onLine which doesn't detect VPN/firewall issues)
    
    // Initial check on page load (delayed to not block page rendering)
    setTimeout(() => checkReachability(true).then(() => updateOnlineStatus()), 1500);
    
    // Set up event listeners for online/offline transitions
    window.addEventListener('online', () => {
        // Wait a bit for network to settle, then check actual reachability
        setTimeout(() => {
            checkReachability(true).then(() => {
                updateOnlineStatus();
                // Silently reconcile IDB with localStorage
                reconcileDatabase().then(() => {
                    render();
                });
            });
        }, 2000);
    });
    window.addEventListener('offline', () => {
        // Navigator says offline - definitely not reachable
        isReachable = false;
        updateOnlineStatus();
        // Silently reconcile IDB with localStorage
        reconcileDatabase().then(() => {
            render();
        });
    });
    
    // Periodic reachability check (every 5 seconds)
    // This catches cases where the network silently goes down or comes back.
    // The user explicitly requested 5-second intervals.
    setInterval(() => {
        checkReachability().then((reachable) => {
            // If state changed, re-render to reflect any UI updates
            // (e.g., the recording button state)
            updateOnlineStatus();
        });
    }, 5000);
    
    // Also check when tab becomes visible again (user might have been away)
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            // Force a fresh reachability check when tab becomes visible
            checkReachability(true).then(() => {
                updateOnlineStatus();
                render();
                checkNotifications();
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ type: 'CHECK_DEADLINES' });
                }
            });
        }
    });

    // Flush pending data when the page is about to unload.
    // Since createWritable() is async (can't run in beforeunload), we can't
    // guarantee the file write completes. But the IDB backup from setDB()
    // should already have the latest data. We do a best-effort IDB flush here.
    window.addEventListener('beforeunload', () => {
        // Flush the IDB backup synchronously (localStorage is sync, IDB
        // backup is async but might complete before the page closes)
        try { saveBackupToIDB(getDB(), getGroups()); } catch(e) {}
    });

    // Migrate legacy localStorage data to IndexedDB
    await migrateLegacyData();

    // One-time migration: CLEAR all task positions so every task is sorted
    // by deadline (past → future) by default. This fixes the issue where
    // the old migrateTaskPositions() had assigned sequential positions to
    // ALL tasks, causing new tasks to NOT go to their chronological position.
    // After this one-time clear, only manually-dragged tasks will have a
    // position (overriding the deadline sort for those tasks).
    // The flag `positions_cleared_v1` ensures this only runs once per device.
    if (!localStorage.getItem('positions_cleared_v1')) {
        const items = getDB();
        let changed = false;
        items.forEach(item => {
            if (typeof item.position === 'number' || item.position !== undefined) {
                try { delete item.position; } catch(e) {}
                item.position = undefined;
                changed = true;
            }
        });
        if (changed) {
            setDB(items);
            console.log('[Page] One-time migration: cleared all task positions');
        }
        localStorage.setItem('positions_cleared_v1', '1');
    }

    // NOTE: migrateTaskPositions() was REMOVED — it was assigning sequential
    // positions to ALL tasks (in deadline order), which meant every task ended
    // up with a position, and the sort logic then used position instead of
    // deadline. This caused new tasks to NOT go to their chronological position
    // (they got pushed to a position-based slot). Now, tasks WITHOUT a position
    // are sorted by deadline (the default), and only manually-dragged tasks
    // have a position (which overrides the deadline sort for those tasks).
    // To reset all tasks to deadline-based ordering, the user can click the
    // ↩ reset button inside any custom group.

    // Migrate existing tasks: assign groupId='all' if missing
    (function migrateGroupIds() {
        const items = getDB();
        let changed = false;
        items.forEach(item => {
            if (!item.groupId) { item.groupId = 'all'; changed = true; }
        });
        if (changed) { setDB(items); console.log('[Page] Migrated task groupIds'); }
    })();

    // Ensure default group exists
    getGroups();

    // Initialize the History API stack so the mobile back button can navigate
    // inside the app (groups ↔ tasks ↔ task details) instead of exiting.
    // We replaceState (not pushState) so the initial groups view doesn't
    // create an extra back-press to leave the app.
    navReplace({ view: 'groups' });

    // Silent reconciliation on startup: ensure IDB matches localStorage.
    // This prevents the "deleted tasks reappear offline" issue and ensures
    // the SW always has the latest data for background notifications.
    await reconcileDatabase();

    // Initialize OPFS (Origin Private File System) — fully automatic file
    // storage without any user gesture. Creates OPFS/YadAvar/database.json
    // automatically. This is the primary auto-save + auto-restore mechanism.
    const opfsOk = await initOPFS();

    // Initialize the File System Access API auto-save (for Downloads/YadAvar/
    // — requires the user to have previously clicked 💾 to grant directory
    // access). This is OPTIONAL — OPFS handles the automatic case.
    await initFileSystemAutoSave();

    // Check if localStorage is empty (e.g., user cleared "Cookies and site
    // data"). If so, try to restore from the IndexedDB backup or the file
    // backup. This ensures data survives even if localStorage is wiped.
    const restored = await restoreDataIfEmpty();
    if (restored) {
        console.log('[Page] Data restored from backup');
    }

    // Initial sync of current reminders to IndexedDB (so SW can see them)
    idbBulkPutReminders(getDB());

    // Use fullRender (not render) so that SortableJS is initialized on
    // page load. Without this, the groups-list drag-drop doesn't activate
    // until the user navigates or triggers a re-render manually.
    fullRender();

    // Initialize notifications (async, loads from IDB)
    loadSentNotifications().then(() => {
        updateNotifButton();
        cleanupOldNotifications();
        checkNotifications();
    });
    updateNotifButton();

    // Register service worker (must be after DOMContentLoaded)
    registerServiceWorker();

    // CRITICAL: Verify the user is on the latest HTML version. Bypass the SW
    // cache by adding a cache-busting query string, fetch the latest HTML
    // from the network, extract its APP_VERSION, and compare with the
    // currently-loaded version. If they differ, the user is running STALE
    // code (the SW is serving an old cached copy) → force a hard reload
    // with a cache-bypass query so the new HTML is fetched and used.
    // This is the safety net that catches users still on the old SW v7
    // (which used cache-first for HTML and would serve old buggy code forever).
    (async function verifyLatestVersion() {
        // Skip on file:// protocol (no network to compare against)
        if (location.protocol === 'file:') return;
        // Skip if currently recording (don't disrupt)
        if (typeof isRecording !== 'undefined' && isRecording) return;
        try {
            // Add a unique cache-busting query param so the SW can't serve
            // its cached copy — it MUST go to the network.
            const bustUrl = location.pathname + '?vcheck=' + Date.now();
            const res = await fetch(bustUrl, { cache: 'no-store' });
            if (!res.ok) return;
            const html = await res.text();
            // Extract the APP_VERSION line from the fetched HTML
            const m = html.match(/const\s+APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
            if (!m) {
                console.warn('[VersionCheck] Could not find APP_VERSION in fetched HTML');
                return;
            }
            const remoteVersion = m[1];
            console.log('[VersionCheck] local=' + APP_VERSION + ' remote=' + remoteVersion);
            if (remoteVersion !== APP_VERSION) {
                console.warn('[VersionCheck] VERSION MISMATCH — forcing hard reload to bypass stale cache');
                // Reload with a cache-busting query so the SW fetches fresh HTML
                location.href = location.pathname + '?fresh=' + Date.now();
                return;
            }
            console.log('[VersionCheck] ✓ Running latest version');
        } catch(e) {
            // Network failed — we're offline or SW bypassed. Don't disrupt.
            console.warn('[VersionCheck] skipped (network error):', e.message);
        }
    })();

    // Re-render every 30 seconds for time-based reordering & color updates
    setInterval(() => {
        render();
        updateHeaderDate();
        checkNotifications();
    }, 30000);

    // Also check notifications more frequently (every 60s) to catch deadlines
    setInterval(checkNotifications, 60000);

    // Run initial check after 2 seconds
    setTimeout(checkNotifications, 2000);

    // Close modal on overlay click
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') cancelModal();
    });

    // Close calendar on overlay click
    const calOverlay = document.getElementById('calendarOverlay');
    if (calOverlay) {
        calOverlay.addEventListener('click', (e) => {
            if (e.target.id === 'calendarOverlay') closeCalendar();
        });
    }

    // Close datetime picker on overlay click
    if (pickerOverlay) {
        pickerOverlay.addEventListener('click', (e) => {
            if (e.target.id === 'datetimePickerOverlay') closeDatetimePicker();
        });
    }

    // Escape key support
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            cancelModal();
            closeCalendar();
            closeDatetimePicker();
        }
    });

    // Show warning if speech not supported
    if (!isSpeechSupported()) {
        setTimeout(() => showToast('نکته: برای تبدیل صوت، از Chrome یا Edge روی Android/PC استفاده کنید'), 800);
    }

    // Detect PWA installability & status
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the default browser install prompt (we use our custom button instead)
        e.preventDefault();
        deferredInstallPrompt = e;
        // Show our custom install button
        if (installBtn) {
            installBtn.style.display = 'flex';
            console.log('[Page] PWA installable - showing install button');
        }
    });

    window.addEventListener('appinstalled', () => {
        // Hide the install button after installation
        if (installBtn) {
            installBtn.style.display = 'none';
        }
        deferredInstallPrompt = null;
        showToast('برنامه نصب شد ✓ اکنون می‌توانید آن را از home screen باز کنید');
        console.log('[Page] PWA installed');
    });

    // Detect if app is already running in standalone (installed) mode
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
        console.log('[Page] Running in standalone (installed) mode');
        // Hide install button if already installed
        if (installBtn) installBtn.style.display = 'none';
    }
    // Also detect via navigator.standalone (iOS)
    if (window.navigator.standalone === true) {
        if (installBtn) installBtn.style.display = 'none';
    }
});

// ============ PWA Install ============
// Top-level variable to hold the deferred install prompt (used by installApp)
let deferredInstallPrompt = null;

// Install the app as a PWA using the deferred prompt
async function installApp() {
    if (!deferredInstallPrompt) {
        showToast('نصب در این مرورگر پشتیبانی نمی‌شود. از منوی Chrome → "Install app" یا "Add to Home screen" استفاده کنید');
        return;
    }
    try {
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') {
            console.log('[Page] User accepted install');
            showToast('در حال نصب...');
        } else {
            console.log('[Page] User dismissed install');
        }
        deferredInstallPrompt = null;
        const installBtn = document.getElementById('installBtn');
        if (installBtn) installBtn.style.display = 'none';
    } catch(e) {
        console.error('[Page] Install failed:', e);
        showToast('خطا در نصب: ' + e.message);
    }
}
</script>
</body>
